<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini App Premium</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: radial-gradient(circle at top, #071a2d, #000);
  color: white;
}

/* HEADER */
.header {
  padding: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.profile {
  display: flex;
  gap: 10px;
  align-items: center;
}

.profile img {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  border: 2px solid gold;
}

.username { font-weight: bold; }
.userid { font-size: 12px; color: #aaa; }

.balanceBox {
  color: gold;
  font-size: 20px;
}

/* CIRCLE */
.circleWrap {
  display: flex;
  justify-content: center;
  margin-top: 20px;
}

.circle {
  width: 260px;
  height: 260px;
  border-radius: 50%;
  background: conic-gradient(gold 0deg, #1a2a40 0deg);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { box-shadow: 0 0 20px rgba(255,200,0,0.4); }
  to { box-shadow: 0 0 45px rgba(255,200,0,0.9); }
}

.inner {
  width: 190px;
  height: 190px;
  background: #020d1a;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

#timer {
  font-size: 48px;
  color: gold;
  font-weight: bold;
}

#earn {
  color: #aaa;
}

/* BOOST */
.boostBtn {
  display: block;
  margin: 25px auto;
  padding: 14px 30px;
  border-radius: 20px;
  border: none;
  background: linear-gradient(45deg, #00c6ff, #0072ff);
  color: white;
  font-size: 16px;
  font-weight: bold;
  box-shadow: 0 0 20px rgba(0,150,255,0.7);
  transition: 0.2s;
}

.boostBtn:active {
  transform: scale(0.9);
}

/* MENU */
.menu {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #071a2d;
  display: flex;
  justify-content: space-around;
  padding: 12px 0;
}

.menuItem {
  color: #777;
  font-size: 12px;
  text-align: center;
  transition: 0.2s;
}

.menuItem.active {
  color: gold;
  transform: scale(1.1);
}

.menuItem span {
  display: block;
  font-size: 18px;
}
</style>

</head>
<body>

<div class="header">
  <div class="profile">
    <img id="avatar" src="https://i.pravatar.cc/100">
    <div>
      <div class="username" id="username">User</div>
      <div class="userid" id="userid">ID: -</div>
    </div>
  </div>

  <div class="balanceBox">
    ⭐ <span id="saldo">0.00000</span>
  </div>
</div>

<div class="circleWrap">
  <div class="circle" id="circle">
    <div class="inner">
      <div id="earn">+0.00001</div>
      <div id="timer">10s</div>
    </div>
  </div>
</div>

<button class="boostBtn" onclick="boost()">⚡ BOOST</button>

<div class="menu">
  <div class="menuItem active" onclick="nav(this)"><span>🏠</span>Home</div>
  <div class="menuItem" onclick="nav(this)"><span>💰</span>Earn</div>
  <div class="menuItem" onclick="nav(this)"><span>🔄</span>Exchange</div>
  <div class="menuItem" onclick="nav(this)"><span>👤</span>Profile</div>
</div>

<script>
let tg = window.Telegram.WebApp;
tg.expand();

// USER
let user = tg.initDataUnsafe.user;
if (user) {
  username.innerText = user.username ? "@" + user.username : user.first_name;
  userid.innerText = "ID: " + user.id;
  if (user.photo_url) avatar.src = user.photo_url;
}

// DATA
let saldo = 0;
let waktu = 10;
let max = 10;
let speed = 1;

// UPDATE UI
function updateUI() {
  saldoEl.innerText = saldo.toFixed(5);
  timer.innerText = Math.ceil(waktu) + "s";
}

// SMOOTH LOOP (60fps)
function loop() {
  waktu -= 0.05 * speed;

  let deg = ((max - waktu) / max) * 360;
  circle.style.background =
    `conic-gradient(gold ${deg}deg, #1a2a40 ${deg}deg)`;

  if (waktu <= 0) {
    let earn = 0.00001 * speed;
    saldo += earn;
    earnEl.innerText = "+" + earn.toFixed(5);
    waktu = max;
  }

  updateUI();
  requestAnimationFrame(loop);
}
loop();

// BOOST
function boost() {
  speed = 2;
  circle.style.boxShadow = "0 0 60px cyan";
  setTimeout(() => {
    speed = 1;
    circle.style.boxShadow = "";
  }, 10000);
}

// MENU
function nav(el) {
  document.querySelectorAll(".menuItem").forEach(m => m.classList.remove("active"));
  el.classList.add("active");
}

// INIT
let saldoEl = document.getElementById("saldo");
let timer = document.getElementById("timer");
let earnEl = document.getElementById("earn");
let circle = document.getElementById("circle");

updateUI();
</script>

</body>
</html>
