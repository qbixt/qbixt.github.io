<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(180deg, #020617, #020617);
  color: white;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  padding: 15px;
}

.profile {
  display: flex;
  align-items: center;
  gap: 8px;
}

.profile img {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 2px solid gold;
}

.nameBox { line-height: 1.2; }
.username { font-size: 14px; font-weight: bold; }
.userid { font-size: 11px; color: #aaa; }

.balance {
  color: gold;
  font-size: 18px;
}

/* CIRCLE */
.wrap {
  display: flex;
  justify-content: center;
  margin-top: 30px;
  position: relative;
}

svg { transform: rotate(-90deg); }

.bg {
  fill: none;
  stroke: #1a2a40;
  stroke-width: 12;
}

.progress {
  fill: none;
  stroke: gold;
  stroke-width: 12;
  stroke-linecap: round;
  filter: drop-shadow(0 0 10px gold);
}

/* TEXT */
.centerText {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  text-align: center;
}

#timer {
  font-size: 48px;
  color: gold;
  font-weight: bold;
}

#earn {
  color: #aaa;
}

/* BUTTON */
button {
  display: block;
  margin: 25px auto;
  padding: 12px 30px;
  border-radius: 20px;
  border: none;
  background: linear-gradient(135deg, #0ea5e9, #2563eb);
  border-radius: 14px;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: white;
  font-size: 15px;
  transition: 0.2s;
}

button:active {
  transform: scale(0.9);
}

/* MENU */
.menu {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: rgba(10, 20, 35, 0.9);
  backdrop-filter: blur(10px);
  display: flex;
  justify-content: space-around;
  padding: 12px 0;
  border-top: 1px solid rgba(255,255,255,0.05);
}

.menuItem {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-size: 11px;
  color: #666;
  transition: 0.2s;
  
}

.menuItem svg {
  width: 22px;
  height: 22px;
  display: block;

}

.menuItem.active {
  color: gold;
  transform: scale(1.1);
  
}

.menuItem.active {
  color: #ffd700;
}

.menuItem.active svg {
  filter: drop-shadow(0 0 6px #ffd700);
}
</style>

</head>
<body>

<div class="header">
  <div class="profile">
    <img id="avatar" src="https://i.pravatar.cc/100">
    <div class="nameBox">
      <div class="username" id="username">User</div>
      <div class="userid" id="userid">ID</div>
    </div>
  </div>

  <div class="balance">⭐ <span id="saldo">0.00000</span></div>
</div>

<div class="wrap">
  <svg width="260" height="260">
    <circle cx="130" cy="130" r="110" class="bg"/>
    <circle cx="130" cy="130" r="110" class="progress" id="progress"/>
  </svg>

  <div class="centerText">
    <div id="earn">+0.00001</div>
    <div id="timer">10s</div>
  </div>
</div>

<button onclick="boost()">⚡ BOOST</button>

<!-- MENU PREMIUM -->
<div class="menu">
  <div class="menuItem active" onclick="nav(this)">
    <svg fill="currentColor" viewBox="0 0 24 24">
      <path d="M12 3l9 9h-3v9h-12v-9h-3z"/>
    </svg>
    Home
  </div>

  <div class="menuItem" onclick="nav(this)">
    <svg fill="currentColor" viewBox="0 0 24 24">
      <path d="M12 1l3 7h7l-5.5 4.5 2 7-6.5-4-6.5 4 2-7-5.5-4.5h7z"/>
    </svg>
    Earn
  </div>

  <div class="menuItem" onclick="nav(this)">
    <svg fill="currentColor" viewBox="0 0 24 24">
      <path d="M7 7h10v4h-10zM7 13h10v4h-10z"/>
    </svg>
    Exchange
  </div>

  <div class="menuItem" onclick="nav(this)">
    <svg fill="currentColor" viewBox="0 0 24 24">
      <path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/>
    </svg>
    Profile
  </div>
</div>

<script>
let tg = window.Telegram.WebApp;
tg.expand();

// USER
let user = tg.initDataUnsafe.user;
if (user) {
  username.innerText = user.username ? "@" + user.username : user.first_name;
  userid.innerText = "ID: " + user.id;
  if (user.photo_url) avatar.src = user.photo_url;
}

// DATA
let saldo = 0;
let max = 10;
let waktu = max;
let speed = 1;

// SVG SETUP
let radius = 110;
let keliling = 2 * Math.PI * radius;
let progress = document.getElementById("progress");

progress.style.strokeDasharray = keliling;
progress.style.strokeDashoffset = keliling;

// TIMER NORMAL
setInterval(() => {
  waktu -= 1 * speed;

  if (waktu <= 0) {
    saldo += 0.00001;
    waktu = max;
  }

  let persen = waktu / max;
  progress.style.strokeDashoffset = keliling * persen;

  saldoEl.innerText = saldo.toFixed(5);
  timer.innerText = waktu + "s";

}, 1000);

// BOOST
function boost() {
  speed = 2;
  setTimeout(() => speed = 1, 8000);
}

// MENU CLICK
function nav(el) {
  document.querySelectorAll(".menuItem").forEach(m => m.classList.remove("active"));
  el.classList.add("active");
}

// ELEMENT
let saldoEl = document.getElementById("saldo");
let timer = document.getElementById("timer");
</script>

</body>
</html>
