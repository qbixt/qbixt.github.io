<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: radial-gradient(circle at top, #071a2d, #000);
  color: white;
  text-align: center;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  padding: 15px;
}

.profile {
  display: flex;
  gap: 10px;
  align-items: center;
}

.profile img {
  width: 50px;
  border-radius: 50%;
  border: 2px solid gold;
}

/* CIRCLE */
.wrap {
  display: flex;
  justify-content: center;
  margin-top: 20px;
}

svg {
  transform: rotate(-90deg);
}

.circle-bg {
  fill: none;
  stroke: #1a2a40;
  stroke-width: 12;
}

.circle-progress {
  fill: none;
  stroke: gold;
  stroke-width: 12;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.1s linear;
  filter: drop-shadow(0 0 10px gold);
}

/* INNER */
.centerText {
  position: absolute;
  margin-top: -160px;
  width: 100%;
}

#timer {
  font-size: 50px;
  color: gold;
}

#earn {
  color: #aaa;
}

/* BUTTON */
button {
  margin-top: 20px;
  padding: 12px 25px;
  border-radius: 15px;
  border: none;
  background: linear-gradient(45deg, #00c6ff, #0072ff);
  color: white;
}

/* MENU */
.menu {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #071a2d;
  display: flex;
  justify-content: space-around;
  padding: 10px 0;
}
.menu div {
  color: #777;
}
.menu .active {
  color: gold;
}
</style>

</head>
<body>

<div class="header">
  <div class="profile">
    <img id="avatar" src="https://i.pravatar.cc/100">
    <div>
      <div id="username">User</div>
      <div id="userid">ID</div>
    </div>
  </div>
  <div>⭐ <span id="saldo">0.00000</span></div>
</div>

<div class="wrap">
  <svg width="260" height="260">
    <circle cx="130" cy="130" r="110" class="circle-bg"/>
    <circle cx="130" cy="130" r="110" class="circle-progress" id="progress"/>
  </svg>
</div>

<div class="centerText">
  <div id="earn">+0.00001</div>
  <div id="timer">10s</div>
</div>

<button onclick="boost()">BOOST</button>

<div class="menu">
  <div class="active">Home</div>
  <div>Earn</div>
  <div>Exchange</div>
  <div>Profile</div>
</div>

<script>
let tg = window.Telegram.WebApp;
tg.expand();

// USER
let user = tg.initDataUnsafe.user;
if (user) {
  username.innerText = user.username ? "@" + user.username : user.first_name;
  userid.innerText = "ID: " + user.id;
  if (user.photo_url) avatar.src = user.photo_url;
}

// DATA
let saldo = 0;
let waktu = 10;
let max = 10;
let speed = 1;

// SVG SETUP
let radius = 110;
let keliling = 2 * Math.PI * radius;
let progress = document.getElementById("progress");

progress.style.strokeDasharray = keliling;
progress.style.strokeDashoffset = keliling;

// LOOP
function loop() {
  waktu -= 0.03 * speed;

  let persen = waktu / max;
  let offset = keliling * persen;

  progress.style.strokeDashoffset = offset;

  if (waktu <= 0) {
    saldo += 0.00001;
    waktu = max;
  }

  saldoEl.innerText = saldo.toFixed(5);
  timer.innerText = Math.ceil(waktu) + "s";

  requestAnimationFrame(loop);
}
loop();

function boost() {
  speed = 2;
  setTimeout(() => speed = 1, 8000);
}

// ELEMENT
let saldoEl = document.getElementById("saldo");
let timer = document.getElementById("timer");
</script>

</body>
</html>
