<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:sans-serif;
  background: radial-gradient(circle at 20% 20%, #0a2a43, transparent 40%),
              radial-gradient(circle at 80% 80%, #001a2f, transparent 40%),
              #020b16;
  color:white;
}
/* HEADER */
.header{
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(10px);
}

.profile{display:flex;gap:10px;align-items:center;}
.profile img{
  width:45px;height:45px;
  border-radius:50%;
  border:2px solid #00d4ff;
}

.balance{color:#ffd700;font-size:18px;}

/* COIN */
.wrap{display:flex;justify-content:center;margin-top:40px;}
.coin-container{position:relative;width:260px;height:260px;}

.coin{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:160px;height:160px;
  background:radial-gradient(circle,#fff,#ffd700);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:70px;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{transform:translate(-50%,-50%) scale(1);box-shadow:0 0 20px gold;}
  100%{transform:translate(-50%,-50%) scale(1.05);box-shadow:0 0 60px gold;}
}

.centerText{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

#timer{font-size:40px;color:#00ffcc;}

/* FLOAT */
.floating{
  position:absolute;
  color:#00ffcc;
  font-weight:bold;
  animation:floatUp 1s forwards;
}

@keyframes floatUp{
  0%{opacity:1;transform:translate(-50%,-50%);}
  100%{opacity:0;transform:translate(-50%,-120px);}
}

button{
  margin:30px auto;
  display:block;
  padding:12px 40px;
  border:none;
  border-radius:30px;
  background:linear-gradient(90deg,#00d4ff,#0077ff);
  color:white;
}

/* CARD */
.card{
  background:#0f2a44;
  padding:15px;
  border-radius:12px;
  margin-bottom:10px;
}

/* WALLET */
.walletCard{
  background:linear-gradient(135deg,#00d4ff,#0077ff);
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 40px rgba(0,0,0,0.5);
}

/* HISTORY */
.historyItem{
  background:#0f2a44;
  padding:10px;
  border-radius:10px;
  margin-bottom:8px;
  font-size:13px;
}

.menu{
  position:fixed;
  bottom:15px;
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-around;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(12px);
  border-radius:20px;
  padding:10px 0;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
}
.menuItem{
  flex:1;
  text-align:center;
  color:#7f8fa6;
  font-size:12px;
  transition:0.2s;
}

.menuItem.active{
  color:#00ffcc;
  transform:scale(1.1);
}

.menuItem svg{
  width:22px;
  height:22px;
  display:block;
  margin:auto;
  margin-bottom:3px;
}
}

.menuItem.active{color:#00ffcc;}
</style>
</head>

<body>

<div class="header">
  <div class="profile">
    <img id="avatar">
    <div>
      <h3 id="username">User</h3>
      <p id="userid">ID: 0000</p>
    </div>
  </div>
  <div class="balance">⭐ <span id="saldo">0.00000</span></div>
</div>

<!-- HOME -->
<div id="homePage">
  <div class="wrap">
    <div class="coin-container" onclick="tapCoin()">
      <div class="coin">🔥</div>
      <div class="centerText">
        <div>+0.00005</div>
        <div id="timer">10s</div>
      </div>
    </div>
  </div>
  <button onclick="boost()">BOOST 🚀</button>
</div>

<!-- TASK -->
<div id="taskPage" style="display:none;padding:20px;">
  <div class="card" onclick="claimTask('Join Channel',0.001)">🚀 Join Channel <span style="float:right;">+0.001</span></div>
  <div class="card" onclick="claimTask('Invite Friend',0.005)">👥 Invite Friend <span style="float:right;">+0.005</span></div>
</div>

<!-- WALLET -->
<div id="walletPage" style="display:none;padding:20px;">
  <div class="walletCard">
    <div>Total Balance</div>
    <div style="font-size:26px;">⭐ <span id="saldo2">0.00000</span></div>
  </div>

  <h3 style="margin-top:20px;">History</h3>
  <div id="history"></div>
</div>

<!-- MENU -->
<div class="menu">
  <div class="menuItem active" onclick="nav(this)">🏠 Home</div>
  <div class="menuItem" onclick="nav(this)">📋 Task</div>
  <div class="menuItem" onclick="nav(this)">💰 Wallet</div>
</div>

<script>
let tg = window.Telegram.WebApp;
tg.expand();

let user = tg.initDataUnsafe.user || {};
username.innerText=user.first_name||"User";
userid.innerText="ID: "+(user.id||"0");
if(user.photo_url) avatar.src=user.photo_url;

/* DATA */
let saldo=parseFloat(localStorage.getItem("saldo"))||0;
let history=JSON.parse(localStorage.getItem("history"))||[];
let claimed=JSON.parse(localStorage.getItem("claimed"))||{};

const saldoEl=saldoEl=document.getElementById("saldo");
const saldo2=document.getElementById("saldo2");
const historyEl=document.getElementById("history");

/* UPDATE UI */
function updateUI(){
  saldoEl.innerText=saldo.toFixed(5);
  saldo2.innerText=saldo.toFixed(5);

  historyEl.innerHTML="";
  history.slice().reverse().forEach(h=>{
    historyEl.innerHTML+=`<div class="historyItem">${h}</div>`;
  });
}

updateUI();

/* TAP */
function tapCoin(){
  saldo+=0.00005;
  history.push("Tap +0.00005");
  save();
  updateUI();
}

/* TASK */
function claimTask(name,amount){
  if(claimed[name]) return alert("Sudah di claim");

  saldo+=amount;
  history.push(name+" +"+amount);
  claimed[name]=true;

  save();
  updateUI();
}

/* SAVE */
function save(){
  localStorage.setItem("saldo",saldo);
  localStorage.setItem("history",JSON.stringify(history));
  localStorage.setItem("claimed",JSON.stringify(claimed));
}

/* BOOST */
function boost(){
  saldo+=0.001;
  history.push("Boost +0.001");
  save();
  updateUI();
}

/* NAV */
function nav(el){
  document.querySelectorAll(".menuItem").forEach(m=>m.classList.remove("active"));
  el.classList.add("active");

  homePage.style.display="none";
  taskPage.style.display="none";
  walletPage.style.display="none";

  if(el.innerText.includes("Home")) homePage.style.display="block";
  if(el.innerText.includes("Task")) taskPage.style.display="block";
  if(el.innerText.includes("Wallet")) walletPage.style.display="block";
}
</script>

</body>
</html>
