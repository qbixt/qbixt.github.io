  <!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body {
  font-family: sans-serif;
  background: linear-gradient(135deg,#c0ffe8,#8ce8ff,#7ab8ff);
}

/* LOADING */
#loadingScreen{
  position:fixed;
  inset:0;
  background:#0a0f1f;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:9999;
}

#iconsContainer{
  position:relative;
  width:100%;
  height:100%;
  max-width:450px;
  max-height:450px;
}

/* HEADER */
.header{
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.profile{display:flex;gap:10px;align-items:center;}
.profile img{width:45px;height:45px;border-radius:50%;}

.balance{color:#ffd700}

/* PAGE */
.wrap{display:flex;justify-content:center;margin-top:40px;}

.coin-container{position:relative;width:260px;height:260px;}

.coin{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:150px;height:150px;
  border-radius:50%;
  background:gold;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
}

button{
  display:block;
  margin:20px auto;
  padding:10px 30px;
  border:none;
  border-radius:20px;
  background:#0077ff;
  color:#fff;
}

/* MENU */
.menu{
  position:fixed;
  bottom:10px;
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-around;
}
.menuItem{padding:10px;}
.menuItem.active{color:#00ffcc;}

</style>
</head>

<body>

<!-- LOADING -->
<div id="loadingScreen">
  <div id="iconsContainer"></div>
  <h3 style="color:#a0f0ff">Loading...</h3>
</div>

<!-- APP -->
<div id="app">

  <div class="header">
    <div class="profile">
      <img id="avatar">
      <div>
        <div id="username">User</div>
        <div id="userid">ID</div>
      </div>
    </div>
    <div class="balance">⭐ <span id="saldo">0</span></div>
  </div>

  <!-- HOME -->
  <div id="homePage">
    <div class="wrap">
      <div class="coin-container" onclick="tapCoin()">
        <div class="coin">🔥</div>
      </div>
    </div>
    <button onclick="boost()">BOOST</button>
  </div>

  <!-- TASK -->
  <div id="taskPage" style="display:none;padding:20px;">
    <div onclick="claim(0.001)">Task 1 +0.001</div>
  </div>

  <!-- WALLET -->
  <div id="walletPage" style="display:none;padding:20px;">
    History
    <div id="history"></div>
  </div>

</div>

<!-- MENU -->
<div class="menu">
  <div class="menuItem active" onclick="nav(0)">🏠</div>
  <div class="menuItem" onclick="nav(1)">📋</div>
  <div class="menuItem" onclick="nav(2)">💰</div>
</div>

<script>
let tg = window.Telegram.WebApp;
tg.expand();

// USER
let user = tg.initDataUnsafe.user || {};
document.getElementById("username").innerText = user.first_name || "User";
document.getElementById("userid").innerText = "ID: " + (user.id || "0");
if(user.photo_url) document.getElementById("avatar").src = user.photo_url;

// DATA
let saldo = 0;
let history = [];

// UPDATE
function update(){
  document.getElementById("saldo").innerText = saldo.toFixed(5);

  let h = "";
  history.forEach(i => h += `<div>${i}</div>`);
  document.getElementById("history").innerHTML = h;
}

// ACTION
function tapCoin(){
  saldo += 0.00005;
  history.push("Tap +0.00005");
  update();
}

function boost(){
  saldo += 0.001;
  history.push("Boost +0.001");
  update();
}

function claim(a){
  saldo += a;
  history.push("Task +" + a);
  update();
}

// NAV
function nav(i){
  homePage.style.display = i==0?"block":"none";
  taskPage.style.display = i==1?"block":"none";
  walletPage.style.display = i==2?"block":"none";
}

// LOADING ANIMASI
window.addEventListener("DOMContentLoaded", () => {

  const loading = document.getElementById("loadingScreen");
  const container = document.getElementById("iconsContainer");

  const icons = ['💎','👑','🏆','💰','🎁','✨','🔥'];

  let delay = 0;

  icons.forEach(icon => {
    setTimeout(() => {
      const el = document.createElement("div");
      el.textContent = icon;
      el.style.position = "absolute";
      el.style.fontSize = "35px";
      el.style.left = Math.random()*80 + "%";
      el.style.top = "80%";
      container.appendChild(el);

      setTimeout(() => {
        el.style.transform = "translateY(-300px)";
        el.style.opacity = "0";
      }, 100);

    }, delay);

    delay += 300;
  });

  // masuk app
  setTimeout(() => {
    loading.style.display = "none";
  }, 3500);

  update();
});
</script>

</body>
</html>
