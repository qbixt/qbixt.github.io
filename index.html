<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#0B0F1A;
  color:#fff;
}

/* HEADER */
.header{padding:15px}
.user{display:flex;align-items:center}
.avatar{
  width:42px;height:42px;border-radius:50%;
  background:#333;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.avatar img{width:100%;height:100%}
.username{margin-left:10px}

.balance{text-align:center}

/* PAGE */
.page{display:none;padding:15px}
.page.active{display:block}

/* TAP */
.tap{display:flex;justify-content:center;margin-top:20px}
.tap-btn{
  width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,#A855F7,#3B82F6);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;
}

/* ENERGY */
.energy{margin:20px}
.bar{height:8px;background:#1F2937;border-radius:10px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#3B82F6,#A855F7)}

/* MINI MENU */
.mini{
  display:flex;
  justify-content:center;
  gap:15px;
}
.mini button{
  padding:10px 20px;
  border:none;
  border-radius:20px;
  background:#1F2937;
  color:white;
  cursor:pointer;
}

/* NAV */
.nav{
  position:fixed;
  bottom:0;left:0;right:0;
  display:flex;
  background:#111;
}
.nav div{
  flex:1;
  text-align:center;
  padding:10px;
  color:#aaa;
  cursor:pointer;
}
.nav .active{color:#A855F7}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="user">
    <div class="avatar" id="avatar">U</div>
    <div class="username" id="username">@Guest</div>
  </div>

  <div class="balance">
    <div>Balance</div>
    <h2 id="balance">0 BGC</h2>
  </div>
</div>

<!-- HOME -->
<div id="home" class="page active">

  <div class="tap">
    <div class="tap-btn" onclick="tap()">BGC</div>
  </div>

  <div class="energy">
    <div id="energyText"></div>
    <div class="bar"><div id="energyFill" class="fill"></div></div>
  </div>

  <div class="mini">
    <button onclick="goPage('boost')">⚡ Boost</button>
    <button onclick="goPage('game')">🎮 Game</button>
  </div>

</div>

<!-- BOOST -->
<div id="boost" class="page">
  <button onclick="goPage('home')">⬅ Back</button>
  <h3>⚡ Energy Boost</h3>

  <button onclick="buyBoost(2500,300)">2500 Energy - 300 BGC</button><br><br>
  <button onclick="buyBoost(5000,500)">5000 Energy - 500 BGC</button><br><br>
  <button onclick="buyBoost(12000,1000)">12000 Energy - 1000 BGC</button>
</div>

<!-- GAME -->
<div id="game" class="page">
  <button onclick="goPage('home')">⬅ Back</button>
  <h3>🎮 Game</h3>

  <h4>Daily Check-in</h4>
  <button onclick="claim()">Claim</button>

  <h4>Spin</h4>
  <button onclick="spin()">Spin</button>
  <p id="spinText"></p>
</div>

<!-- TASK -->
<div id="task" class="page"><h3>Task</h3></div>

<!-- RANK -->
<div id="rank" class="page"><h3>Rank</h3></div>

<!-- TEAM -->
<div id="team" class="page"><h3>Team</h3></div>

<!-- WALLET -->
<div id="wallet" class="page"><h3>Wallet</h3></div>

<!-- NAV -->
<div class="nav">
  <div class="active" onclick="navClick(this,'home')">🏠</div>
  <div onclick="navClick(this,'task')">📋</div>
  <div onclick="navClick(this,'rank')">🏆</div>
  <div onclick="navClick(this,'team')">👥</div>
  <div onclick="navClick(this,'wallet')">💰</div>
</div>

<script>
// TELEGRAM USER FIX
setTimeout(()=>{
  let tg=window.Telegram.WebApp;
  let u=tg.initDataUnsafe?.user;

  if(u){
    document.getElementById("username").innerText="@"+(u.username||u.first_name);
    if(u.photo_url){
      document.getElementById("avatar").innerHTML="<img src='"+u.photo_url+"'>";
    }else{
      document.getElementById("avatar").innerText=(u.first_name||"U")[0];
    }
  }
},500);

// DATA
let balance=parseInt(localStorage.balance)||0;
let maxEnergy=parseInt(localStorage.maxEnergy)||1000;
let energy=parseInt(localStorage.energy)||maxEnergy;

// UPDATE UI
function updateUI(){
  document.getElementById("balance").innerText=balance+" BGC";
  document.getElementById("energyText").innerText=energy+" / "+maxEnergy;
  document.getElementById("energyFill").style.width=(energy/maxEnergy*100)+"%";
}

// SAVE
function save(){
  localStorage.balance=balance;
  localStorage.energy=energy;
  localStorage.maxEnergy=maxEnergy;
}

// TAP
function tap(){
  if(energy<=0)return;
  balance++;
  energy--;
  save();
  updateUI();
}

// REGEN
setInterval(()=>{
  if(energy<maxEnergy){
    energy++;
    save();
    updateUI();
  }
},5000);

// NAVIGATION
function goPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function navClick(el,id){
  document.querySelectorAll(".nav div").forEach(x=>x.classList.remove("active"));
  el.classList.add("active");
  goPage(id);
}

// BOOST
function buyBoost(val,price){
  if(balance<price){
    alert("Not enough BGC");
    return;
  }
  balance-=price;
  maxEnergy=val;
  energy=val;
  save();
  updateUI();
}

// DAILY
let lastClaim=parseInt(localStorage.lastClaim)||0;

function claim(){
  let now=Date.now();
  if(now-lastClaim<86400000){
    alert("Already claimed today");
    return;
  }

  balance+=100;
  localStorage.lastClaim=now;
  save();
  updateUI();
}

// SPIN
let lastSpin=parseInt(localStorage.lastSpin)||0;

function spin(){
  let now=Date.now();
  if(now-lastSpin<86400000){
    alert("Already spin today");
    return;
  }

  let rewards=[50,10,1000,5];
  let r=rewards[Math.floor(Math.random()*rewards.length)];

  balance+=r;
  document.getElementById("spinText").innerText="You got "+r+" BGC";

  localStorage.lastSpin=now;
  save();
  updateUI();
}

// INIT
updateUI();
</script>

</body>
</html>
