<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #0B0F1A;
  color: white;
}

/* HEADER */
.header {
  padding: 15px;
}

.user {
  display: flex;
  align-items: center;
}

.avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  overflow: hidden;
  background: linear-gradient(135deg, #3B82F6, #A855F7);
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.username {
  margin-left: 10px;
  font-size: 14px;
}

/* BALANCE */
.balance {
  text-align: center;
  margin-top: 10px;
}

.balance h1 {
  margin: 5px 0;
  font-size: 30px;
  background: linear-gradient(90deg, #3B82F6, #A855F7, #EC4899);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* TAP */
.tap-area {
  display: flex;
  justify-content: center;
  margin-top: 40px;
}

.tap-btn {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  overflow: hidden;
  background: radial-gradient(circle, #A855F7, #3B82F6);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  cursor: pointer;
  position: relative;

  box-shadow:
    0 0 40px rgba(168,85,247,0.6),
    inset 0 0 20px rgba(255,255,255,0.2);

  transition: transform 0.08s ease;
}

/* PRESS */
.tap-btn:active {
  transform: scale(0.93);
}

/* BOUNCE */
.tap-btn.bounce {
  animation: bounce 0.2s;
}

@keyframes bounce {
  0% { transform: scale(1); }
  50% { transform: scale(1.12); }
  100% { transform: scale(1); }
}

/* +1 EFFECT */
.plus {
  position: absolute;
  color: #EC4899;
  font-weight: bold;
  animation: floatUp 0.8s ease-out forwards;
}

@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-50px); }
}

/* ENERGY */
.energy-box {
  margin: 30px 20px 90px;
}

.energy-text {
  font-size: 13px;
  color: #9CA3AF;
  margin-bottom: 5px;
}

.energy-bar {
  width: 100%;
  height: 8px;
  background: #1F2937;
  border-radius: 10px;
  overflow: hidden;
}

.energy-fill {
  height: 100%;
  background: linear-gradient(90deg, #3B82F6, #A855F7);
  width: 100%;
  transition: 0.3s;
}

/* BOTTOM NAV */
.bottom-nav {
  position: fixed;
  bottom: 15px;
  left: 10px;
  right: 10px;
  height: 65px;
  display: flex;
  border-radius: 20px;
  background: rgba(20,25,40,0.85);
  backdrop-filter: blur(10px);
  box-shadow: 0 0 20px rgba(168,85,247,0.2);
}

.bottom-nav a {
  flex: 1;
  text-align: center;
  text-decoration: none;
  color: #9CA3AF;
  font-size: 12px;
  padding-top: 8px;
}

.bottom-nav a.active {
  color: #A855F7;
}

.icon {
  display: block;
  font-size: 20px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="user">
    <div class="avatar" id="avatar"></div>
    <div class="username" id="username">@Guest</div>
  </div>

  <div class="balance">
    <div>Balance</div>
    <h1 id="balance">0 BGC</h1>
  </div>
</div>

<!-- TAP -->
<div class="tap-area">
  <div class="tap-btn" id="tapBtn" onclick="tap()">BGC</div>
</div>

<!-- ENERGY -->
<div class="energy-box">
  <div class="energy-text" id="energyText">Energy: 1000 / 1000</div>
  <div class="energy-bar">
    <div class="energy-fill" id="energyFill"></div>
  </div>
</div>

<!-- NAV -->
<div class="bottom-nav">
  <a class="active"><span class="icon">🏠</span>Home</a>
  <a><span class="icon">📋</span>Task</a>
  <a><span class="icon">🏆</span>Rank</a>
  <a><span class="icon">👥</span>Team</a>
  <a><span class="icon">💰</span>Wallet</a>
</div>

<script>
let tg = window.Telegram.WebApp;
tg.expand();

// USER
let user = tg.initDataUnsafe.user;

if (user) {
  document.getElementById("username").innerText =
    "@" + (user.username || user.first_name);

  // Avatar
  if (user.photo_url) {
    document.getElementById("avatar").innerHTML =
      "<img src='" + user.photo_url + "'>";
  } else {
    document.getElementById("avatar").innerText =
      user.first_name.charAt(0);
  }
}

// SYSTEM
let balance = 0;
let energy = 1000;
let maxEnergy = 1000;

// TAP
function tap() {
  if (energy <= 0) return;

  balance++;
  energy--;

  updateUI();

  let btn = document.getElementById("tapBtn");

  btn.classList.add("bounce");
  setTimeout(() => btn.classList.remove("bounce"), 200);

  let plus = document.createElement("div");
  plus.innerText = "+1";
  plus.className = "plus";
  plus.style.left = Math.random() * 140 + "px";
  plus.style.top = "90px";
  btn.appendChild(plus);

  setTimeout(() => plus.remove(), 800);
}

// UPDATE
function updateUI() {
  document.getElementById("balance").innerText = balance + " BGC";
  document.getElementById("energyText").innerText =
    "Energy: " + energy + " / " + maxEnergy;

  let percent = (energy / maxEnergy) * 100;
  document.getElementById("energyFill").style.width = percent + "%";
}

// REGEN
setInterval(() => {
  if (energy < maxEnergy) {
    energy++;
    updateUI();
  }
}, 1500);
</script>

</body>
</html>
