<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, sans-serif;
  background:#0A0F1C;
  color:#fff;
}

/* HEADER */
.header{
  padding:15px;
}
.user{
  display:flex;
  align-items:center;
}
.avatar{
  width:40px;height:40px;
  border-radius:50%;
  background:#1C2333;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.avatar img{width:100%}
.username{margin-left:10px;color:#9CA3AF;font-size:13px}

.balance{
  text-align:center;
  margin-top:10px;
}
.balance h1{
  margin:0;
  font-size:28px;
  letter-spacing:1px;
}

/* PAGE */
.page{display:none;padding:15px}
.active{display:block}

/* TAP BUTTON */
.tap{
  display:flex;
  justify-content:center;
  margin-top:25px;
}
.tap-btn{
  width:180px;height:180px;
  border-radius:50%;
  background:#111827;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  border:2px solid #1F2937;
  box-shadow:0 0 30px rgba(0,0,0,0.5);
  position:relative;
  transition:.1s;
}
.tap-btn:active{
  transform:scale(.95);
}

/* TAP EFFECT */
.particle{
  position:absolute;
  font-size:13px;
  color:#A855F7;
  animation:float .7s forwards;
}
@keyframes float{
  from{opacity:1;transform:translateY(0)}
  to{opacity:0;transform:translateY(-40px)}
}

/* ENERGY */
.energy{
  margin-top:20px;
}
.energy-text{
  font-size:12px;
  color:#6B7280;
}
.bar{
  height:6px;
  background:#1F2937;
  border-radius:10px;
  margin-top:5px;
}
.fill{
  height:100%;
  background:#6366F1;
  border-radius:10px;
}

/* MINI BUTTON */
.mini{
  display:flex;
  gap:10px;
  margin-top:20px;
}
.mini button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#111827;
  color:#E5E7EB;
  font-size:13px;
}

/* CARD */
.card{
  background:#111827;
  padding:15px;
  border-radius:15px;
  margin-top:15px;
}

/* CHECKIN */
.checkin{
  display:flex;
  gap:6px;
  overflow:auto;
}
.checkin div{
  min-width:55px;
  padding:8px;
  background:#1F2937;
  border-radius:10px;
  font-size:11px;
}

/* SPIN */
#wheel{
  width:140px;height:140px;
  border-radius:50%;
  margin:auto;
  background:#1F2937;
  border:3px solid #374151;
}
.spin-btn{
  margin-top:10px;
  padding:10px;
  width:100%;
  border:none;
  border-radius:10px;
  background:#6366F1;
  color:white;
}

/* NAV */
.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  background:#0F172A;
  border-top:1px solid #1F2937;
}
.nav div{
  flex:1;
  text-align:center;
  padding:10px;
  font-size:12px;
  color:#6B7280;
}
.nav .active{
  color:#6366F1;
}
</style>
</head>

<body>

<div class="header">
  <div class="user">
    <div class="avatar" id="avatar">U</div>
    <div id="username">@Guest</div>
  </div>

  <div class="balance">
    <h1 id="balance">0</h1>
    <div style="font-size:12px;color:#6B7280">BGC</div>
  </div>
</div>

<!-- HOME -->
<div id="home" class="page active">

  <div class="tap">
    <div class="tap-btn" onclick="tap()" id="tapBtn">TAP</div>
  </div>

  <div class="energy">
    <div class="energy-text" id="energyText"></div>
    <div class="bar"><div id="energyFill" class="fill"></div></div>
  </div>

  <div class="mini">
    <button onclick="openPage('boost')">Boost</button>
    <button onclick="openPage('game')">Game</button>
  </div>

</div>

<!-- BOOST -->
<div id="boost" class="page">
  <button onclick="openPage('home')">← Back</button>

  <div class="card">
    <b>Energy Upgrade</b><br><br>
    <button onclick="buy(2500,300)">2500 Energy</button><br><br>
    <button onclick="buy(5000,500)">5000 Energy</button><br><br>
    <button onclick="buy(12000,1000)">12000 Energy</button>
  </div>
</div>

<!-- GAME -->
<div id="game" class="page">
  <button onclick="openPage('home')">← Back</button>

  <div class="card">
    <b>Daily Check-in</b>
    <div id="checkin" class="checkin"></div>
    <button onclick="claim()">Claim</button>
  </div>

  <div class="card">
    <b>Spin</b>
    <div id="wheel"></div>
    <button class="spin-btn" onclick="spin()">Spin</button>
    <div id="spinText"></div>
  </div>
</div>

<!-- NAV -->
<div class="nav">
  <div class="active" onclick="nav(this,'home')">Home</div>
  <div onclick="nav(this,'boost')">Boost</div>
  <div onclick="nav(this,'game')">Game</div>
</div>

<script>
// DATA
let balance=+localStorage.balance||0;
let energy=+localStorage.energy||1000;
let maxEnergy=+localStorage.maxEnergy||1000;

function update(){
  balanceEl.innerText=balance;
  energyText.innerText=energy+" / "+maxEnergy;
  energyFill.style.width=(energy/maxEnergy*100)+"%";
}
update();

function save(){
  localStorage.balance=balance;
  localStorage.energy=energy;
  localStorage.maxEnergy=maxEnergy;
}

// TAP
function tap(){
  if(energy<=0)return;
  balance++;energy--;
  save();update();

  let p=document.createElement("div");
  p.className="particle";
  p.innerText="+1";
  p.style.left=Math.random()*100+"px";
  p.style.top="80px";
  tapBtn.appendChild(p);
  setTimeout(()=>p.remove(),700);
}

// NAV
function openPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function nav(el,id){
  document.querySelectorAll(".nav div").forEach(x=>x.classList.remove("active"));
  el.classList.add("active");
  openPage(id);
}

// BOOST
function buy(val,price){
  if(balance<price)return alert("Not enough");
  balance-=price;
  maxEnergy=val;
  energy=val;
  save();update();
}

// DAILY
let rewards=[50,150,200,300,400,450,700];
let day=+localStorage.day||0;

function render(){
  checkin.innerHTML="";
  rewards.forEach((r,i)=>{
    let d=document.createElement("div");
    d.innerText=i<day?"✓":"D"+(i+1);
    checkin.appendChild(d);
  });
}
render();

function claim(){
  balance+=rewards[day];
  day=(day+1)%7;
  localStorage.day=day;
  save();update();render();
}

// SPIN
function spin(){
  let r=[10,50,100,500][Math.floor(Math.random()*4)];
  balance+=r;
  spinText.innerText="+"+r;
  save();update();
}
</script>

</body>
  </html>
