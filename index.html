<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini App Pro</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: radial-gradient(circle at top, #071a2d, #000);
  color: white;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  padding: 15px;
}

.profile {
  display: flex;
  gap: 10px;
  align-items: center;
}

.profile img {
  width: 50px;
  border-radius: 50%;
  border: 2px solid gold;
}

.username { font-weight: bold; }
.userid { font-size: 12px; color: #aaa; }

.balance {
  color: gold;
  font-size: 20px;
}

/* CIRCLE */
.wrap {
  display: flex;
  justify-content: center;
  margin-top: 20px;
}

.circle {
  width: 260px;
  height: 260px;
  border-radius: 50%;
  background: conic-gradient(gold 0deg, #1a2a40 0deg);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 40px rgba(255,200,0,0.5);
}

.inner {
  width: 190px;
  height: 190px;
  background: #020d1a;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

#timer {
  font-size: 48px;
  color: gold;
}

#earn {
  color: #aaa;
}

/* BOOST */
.boost {
  display: block;
  margin: 25px auto;
  padding: 14px 30px;
  border-radius: 20px;
  border: none;
  background: linear-gradient(45deg, #00c6ff, #0072ff);
  color: white;
  font-size: 16px;
  overflow: hidden;
  position: relative;
}

/* RIPPLE */
.boost span {
  position: absolute;
  border-radius: 50%;
  transform: scale(0);
  background: rgba(255,255,255,0.5);
  animation: ripple 0.6s linear;
}

@keyframes ripple {
  to {
    transform: scale(4);
    opacity: 0;
  }
}

/* MENU */
.menu {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #071a2d;
  display: flex;
  justify-content: space-around;
  padding: 10px 0;
}

.menuItem {
  text-align: center;
  color: #777;
  font-size: 12px;
}

.menuItem.active {
  color: gold;
}

.menuItem svg {
  width: 22px;
  height: 22px;
  display: block;
  margin: auto;
}
</style>

</head>
<body>

<div class="header">
  <div class="profile">
    <img id="avatar" src="https://i.pravatar.cc/100">
    <div>
      <div id="username">User</div>
      <div id="userid">ID: -</div>
    </div>
  </div>
  <div class="balance">⭐ <span id="saldo">0.00000</span></div>
</div>

<div class="wrap">
  <div class="circle" id="circle">
    <div class="inner">
      <div id="earn">+0.00001</div>
      <div id="timer">10s</div>
    </div>
  </div>
</div>

<button class="boost" onclick="boost(event)">⚡ BOOST</button>

<div class="menu">
  <div class="menuItem active" onclick="nav(this)">
    <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 3l9 9h-3v9h-12v-9h-3z"/></svg>
    Home
  </div>
  <div class="menuItem" onclick="nav(this)">
    <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 1l3 7h7l-5.5 4.5 2 7-6.5-4-6.5 4 2-7-5.5-4.5h7z"/></svg>
    Earn
  </div>
  <div class="menuItem" onclick="nav(this)">
    <svg fill="currentColor" viewBox="0 0 24 24"><path d="M7 7h10v4h-10zM7 13h10v4h-10z"/></svg>
    Exchange
  </div>
  <div class="menuItem" onclick="nav(this)">
    <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/></svg>
    Profile
  </div>
</div>

<script>
let tg = window.Telegram.WebApp;
tg.expand();

// USER
let user = tg.initDataUnsafe.user;
if (user) {
  username.innerText = user.username ? "@" + user.username : user.first_name;
  userid.innerText = "ID: " + user.id;
  if (user.photo_url) avatar.src = user.photo_url;
}

// DATA
let saldo = 0;
let waktu = 10;
let max = 10;
let speed = 1;

// LOOP SMOOTH
function loop() {
  waktu -= 0.05 * speed;

  let deg = ((max - waktu) / max) * 360;
  circle.style.background =
    `conic-gradient(gold ${deg}deg, #1a2a40 ${deg}deg)`;

  if (waktu <= 0) {
    saldo += 0.00001;
    waktu = max;
  }

  saldoEl.innerText = saldo.toFixed(5);
  timer.innerText = Math.ceil(waktu) + "s";

  requestAnimationFrame(loop);
}
loop();

// BOOST + RIPPLE
function boost(e) {
  speed = 2;

  let ripple = document.createElement("span");
  let rect = e.target.getBoundingClientRect();
  ripple.style.left = (e.clientX - rect.left) + "px";
  ripple.style.top = (e.clientY - rect.top) + "px";

  e.target.appendChild(ripple);

  setTimeout(() => ripple.remove(), 600);
  setTimeout(() => speed = 1, 8000);
}

// MENU
function nav(el) {
  document.querySelectorAll(".menuItem").forEach(m => m.classList.remove("active"));
  el.classList.add("active");
}

// ELEMENT
let saldoEl = document.getElementById("saldo");
let timer = document.getElementById("timer");
let circle = document.getElementById("circle");
</script>

</body>
</html>
