<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #0B0F1A;
  color: white;
}

.content {
  padding: 20px;
  padding-bottom: 80px;
}

.bottom-nav {
  position: fixed;
  bottom: 15px;
  left: 10px;
  right: 10px;
  height: 65px;
  display: flex;
  border-radius: 20px;
  background: rgba(20, 25, 40, 0.8);
  backdrop-filter: blur(10px);
  box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
}

.bottom-nav a {
  flex: 1;
  text-align: center;
  text-decoration: none;
  color: #9CA3AF;
  font-size: 12px;
  padding-top: 8px;
  transition: 0.3s;
}

.bottom-nav a.active {
  color: #A855F7;
}

.icon {
  display: block;
  font-size: 20px;
  margin-bottom: 3px;
}

/* Glow effect aktif */
.bottom-nav a.active .icon {
  text-shadow: 0 0 10px #A855F7, 0 0 20px #EC4899;
}
</style>
</head>

<body>

<div class="content">
  <h2>BGC Dashboard</h2>
  <p>Welcome to your project</p>
</div>

<div class="bottom-nav">
  <a class="active" href="#">
    <span class="icon">🏠</span>
    Home
  </a>
  <a href="#">
    <span class="icon">📋</span>
    Task
  </a>
  <a href="#">
    <span class="icon">🏆</span>
    Rank
  </a>
  <a href="#">
    <span class="icon">👥</span>
    Team
  </a>
  <a href="#">
    <span class="icon">💰</span>
    Wallet
  </a>
</div>

</body>
</html>
