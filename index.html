<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #0B0F1A;
  color: white;
}

/* HEADER */
.header {
  padding: 15px;
}

.user {
  display: flex;
  align-items: center;
}

.avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, #3B82F6, #A855F7);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.username {
  margin-left: 10px;
  font-size: 14px;
}

/* BALANCE */
.balance {
  text-align: center;
  margin-top: 10px;
}

.balance h1 {
  margin: 5px 0;
  font-size: 28px;
  background: linear-gradient(90deg, #3B82F6, #A855F7, #EC4899);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* TAP AREA */
.tap-area {
  display: flex;
  justify-content: center;
  margin-top: 40px;
}

.tap-btn {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, #A855F7, #3B82F6);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  cursor: pointer;
  box-shadow: 0 0 40px rgba(168,85,247,0.7);
  transition: 0.1s;
  position: relative;
}

/* Animasi klik */
.tap-btn:active {
  transform: scale(0.9);
}

/* Bounce */
.tap-btn.bounce {
  animation: bounce 0.2s;
}

@keyframes bounce {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

/* Floating +1 */
.plus {
  position: absolute;
  color: #EC4899;
  font-weight: bold;
  animation: floatUp 0.8s ease-out forwards;
}

@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-40px); }
}

/* ENERGY */
.energy-box {
  margin: 30px 20px;
}

.energy-text {
  font-size: 13px;
  color: #9CA3AF;
  margin-bottom: 5px;
}

/* BAR */
.energy-bar {
  width: 100%;
  height: 8px;
  background: #1F2937;
  border-radius: 10px;
  overflow: hidden;
}

.energy-fill {
  height: 100%;
  background: linear-gradient(90deg, #3B82F6, #A855F7);
  width: 100%;
  transition: 0.3s;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="user">
    <div class="avatar" id="avatar">U</div>
    <div class="username" id="username">Loading...</div>
  </div>

  <div class="balance">
    <div>Balance</div>
    <h1 id="balance">0 BGC</h1>
  </div>
</div>

<!-- TAP -->
<div class="tap-area">
  <div class="tap-btn" id="tapBtn" onclick="tap()">
    BGC
  </div>
</div>

<!-- ENERGY -->
<div class="energy-box">
  <div class="energy-text" id="energyText">Energy: 1000 / 1000</div>
  <div class="energy-bar">
    <div class="energy-fill" id="energyFill"></div>
  </div>
</div>

<script>
let tg = window.Telegram.WebApp;
tg.expand();

// USER
let user = tg.initDataUnsafe.user;

if (user) {
  document.getElementById("username").innerText =
    "@" + (user.username || user.first_name);

  document.getElementById("avatar").innerText =
    user.first_name.charAt(0);
}

// SYSTEM
let balance = 0;
let energy = 1000;
let maxEnergy = 1000;

// TAP
function tap() {
  if (energy <= 0) return;

  balance++;
  energy--;

  updateUI();

  // Bounce
  let btn = document.getElementById("tapBtn");
  btn.classList.add("bounce");
  setTimeout(() => btn.classList.remove("bounce"), 200);

  // +1 efek
  let plus = document.createElement("div");
  plus.innerText = "+1";
  plus.className = "plus";
  plus.style.left = Math.random() * 120 + "px";
  plus.style.top = "80px";
  btn.appendChild(plus);

  setTimeout(() => plus.remove(), 800);
}

// UPDATE UI
function updateUI() {
  document.getElementById("balance").innerText = balance + " BGC";
  document.getElementById("energyText").innerText =
    "Energy: " + energy + " / " + maxEnergy;

  let percent = (energy / maxEnergy) * 100;
  document.getElementById("energyFill").style.width = percent + "%";
}

// ENERGY REGEN
setInterval(() => {
  if (energy < maxEnergy) {
    energy++;
    updateUI();
  }
}, 1500);
</script>

</body>
</html>
