<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family:sans-serif;
  background:linear-gradient(to bottom,#0a1f38,#000814);
  color:white;
}

/* HEADER */
.header{
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(0,0,0,0.5);
}

.profile{display:flex;gap:10px;align-items:center;}
.profile img{width:45px;height:45px;border-radius:50%;border:2px solid cyan;}

.balance{color:gold;font-size:18px;}

/* COIN */
.wrap{display:flex;justify-content:center;margin-top:40px;}

.coin-container{position:relative;width:260px;height:260px;}

.coin{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:160px;height:160px;
  background:radial-gradient(circle,#fff,#ffd700);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:70px;
  box-shadow:0 0 40px gold;
}

.centerText{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

#timer{font-size:40px;color:#00ffcc;}

button{
  margin:30px auto;
  display:block;
  padding:12px 40px;
  border:none;
  border-radius:30px;
  background:linear-gradient(90deg,#00d4ff,#0077ff);
  color:white;
}

/* MENU */
.menu{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  background:#0a1f38;
  border-top:1px solid #1e3a6b;
}

.menuItem{
  flex:1;
  text-align:center;
  padding:10px;
  color:#888;
}

.menuItem.active{color:#00ffcc;}
</style>
</head>

<body>

<div class="header">
  <div class="profile">
    <img src="https://i.pravatar.cc/150">
    <div>
      <div>User</div>
      <small>ID: 0000</small>
    </div>
  </div>
  <div class="balance">⭐ <span id="saldo">0.00000</span></div>
</div>

<!-- HOME -->
<div id="homePage">
  <div class="wrap">
    <div class="coin-container" onclick="tapCoin()">

      <svg width="260" height="260">
        <circle cx="130" cy="130" r="115"
          fill="none"
          stroke="#1e3a6b"
          stroke-width="18"/>

        <circle cx="130" cy="130" r="115"
          fill="none"
          stroke="#ffd700"
          stroke-width="18"
          stroke-linecap="round"
          transform="rotate(-90 130 130)"
          id="progress"/>
      </svg>

      <div class="coin">🔥</div>

      <div class="centerText">
        <div>+0.00005</div>
        <div id="timer">10s</div>
      </div>

    </div>
  </div>

  <button onclick="boost()">BOOST 🚀</button>
</div>

<!-- TASK -->
<div id="taskPage" style="display:none;text-align:center;margin-top:100px;">
  <h2>🚀 Task</h2>
  <p>Nanti isi misi di sini</p>
</div>

<!-- WALLET -->
<div id="walletPage" style="display:none;text-align:center;margin-top:100px;">
  <h2>💰 Wallet</h2>
  <p>Nanti isi saldo / withdraw</p>
</div>

<!-- MENU -->
<div class="menu">
  <div class="menuItem active" onclick="nav(this)">Home</div>
  <div class="menuItem" onclick="nav(this)">Task</div>
  <div class="menuItem" onclick="nav(this)">Wallet</div>
</div>

<script>
let saldo=0;
let waktu=10;
let speed=1;

const saldoEl=document.getElementById("saldo");
const timerEl=document.getElementById("timer");
const progress=document.getElementById("progress");

const radius=115;
const circumference=2*Math.PI*radius;
progress.style.strokeDasharray=circumference;

setInterval(()=>{
  waktu-=0.1*speed;

  if(waktu<=0){
    saldo+=0.00001;
    waktu=10;
  }

  let percent=waktu/10;
  progress.style.strokeDashoffset=circumference*percent;

  saldoEl.innerText=saldo.toFixed(5);
  timerEl.innerText=Math.ceil(waktu)+"s";

},100);

function tapCoin(){
  saldo+=0.00005;
}

function boost(){
  speed=2.5;
  setTimeout(()=>speed=1,8000);
}

function nav(el){
  document.querySelectorAll(".menuItem").forEach(m=>m.classList.remove("active"));
  el.classList.add("active");

  let name=el.innerText;

  document.getElementById("homePage").style.display="none";
  document.getElementById("taskPage").style.display="none";
  document.getElementById("walletPage").style.display="none";

  if(name==="Home") document.getElementById("homePage").style.display="block";
  if(name==="Task") document.getElementById("taskPage").style.display="block";
  if(name==="Wallet") document.getElementById("walletPage").style.display="block";
}
</script>

</body>
</html>
