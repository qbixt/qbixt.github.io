<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:sans-serif;
  background: linear-gradient(160deg,#020b16,#061a2b,#020b16);
  color:white;
}

/* HEADER */
.header{
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(10px);
}

.profile{display:flex;gap:10px;align-items:center;}
.profile img{
  width:45px;height:45px;
  border-radius:50%;
  border:2px solid #00d4ff;
}

.balance{color:#ffd700;font-size:18px;}

/* COIN */
.wrap{display:flex;justify-content:center;margin-top:40px;}
.coin-container{position:relative;width:260px;height:260px;}

.coin{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:160px;height:160px;
  background:radial-gradient(circle,#fff,#ffd700);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:70px;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{transform:translate(-50%,-50%) scale(1);box-shadow:0 0 20px gold;}
  100%{transform:translate(-50%,-50%) scale(1.05);box-shadow:0 0 60px gold;}
}

.centerText{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

#timer{font-size:40px;color:#00ffcc;}

/* FLOATING */
.floating{
  position:absolute;
  color:#00ffcc;
  font-weight:bold;
  animation:floatUp 1s forwards;
}

@keyframes floatUp{
  0%{opacity:1;transform:translate(-50%,-50%);}
  100%{opacity:0;transform:translate(-50%,-120px);}
}

button{
  margin:30px auto;
  display:block;
  padding:12px 40px;
  border:none;
  border-radius:30px;
  background:linear-gradient(90deg,#00d4ff,#0077ff);
  color:white;
}

/* CARD */
.card{
  background:#0f2a44;
  padding:15px;
  border-radius:12px;
  margin-bottom:10px;
}

/* WALLET CARD */
.walletCard{
  background:linear-gradient(135deg,#00d4ff,#0077ff);
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 40px rgba(0,0,0,0.5);
}

/* MENU */
.menu{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  background:#0a1f38;
  border-top:1px solid #1e3a6b;
}

.menuItem{
  flex:1;
  text-align:center;
  padding:8px 0;
  color:#7f8fa6;
  font-size:12px;
}

.menuItem svg{
  width:24px;height:24px;
  display:block;
  margin:0 auto 3px;
  fill:currentColor;
}

.menuItem.active{color:#00ffcc;}
.menuItem:active{transform:scale(0.9);}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="profile">
    <img id="avatar">
    <div>
      <h3 id="username">User</h3>
      <p id="userid">ID: 0000</p>
    </div>
  </div>
  <div class="balance">⭐ <span id="saldo">0.00000</span></div>
</div>

<!-- HOME -->
<div id="homePage">
  <div class="wrap">
    <div class="coin-container" onclick="tapCoin()">

      <svg width="260" height="260">
        <circle cx="130" cy="130" r="115"
          fill="none" stroke="#1e3a6b" stroke-width="18"/>
        <circle cx="130" cy="130" r="115"
          fill="none" stroke="#ffd700" stroke-width="18"
          stroke-linecap="round"
          transform="rotate(-90 130 130)"
          id="progress"/>
      </svg>

      <div class="coin">🔥</div>

      <div class="centerText">
        <div>+0.00005</div>
        <div id="timer">10s</div>
      </div>

    </div>
  </div>

  <button onclick="boost()">BOOST 🚀</button>
</div>

<!-- TASK -->
<div id="taskPage" style="display:none;padding:20px;">
  <div class="card">🚀 Join Channel <span style="float:right;">+0.001</span></div>
  <div class="card">👥 Invite Friend <span style="float:right;">+0.005</span></div>
</div>

<!-- WALLET -->
<div id="walletPage" style="display:none;padding:20px;">
  
  <div class="walletCard">
    <div style="opacity:0.8;">Total Balance</div>
    <div style="font-size:28px;font-weight:bold;">
      ⭐ <span id="saldo2">0.00000</span>
    </div>
  </div>

  <div style="margin-top:20px;">
    <div class="card">💸 Withdraw</div>
    <div class="card">📜 History</div>
  </div>

</div>

<!-- MENU -->
<div class="menu">
  <div class="menuItem active" onclick="nav(this)">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    Home
  </div>
  <div class="menuItem" onclick="nav(this)">
    <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7H3V3h11"/></svg>
    Task
  </div>
  <div class="menuItem" onclick="nav(this)">
    <svg viewBox="0 0 24 24"><path d="M3 7h18v10H3z"/><path d="M17 11a2 2 0 100 4 2 2 0 000-4z"/></svg>
    Wallet
  </div>
</div>

<script>
let tg = window.Telegram.WebApp;
tg.expand();

let user = tg.initDataUnsafe.user || {};
document.getElementById("username").innerText = user.first_name || "User";
document.getElementById("userid").innerText = "ID: " + (user.id || "0000");

if(user.photo_url){
  document.getElementById("avatar").src = user.photo_url;
}

let saldo=0;
let waktu=10;
let speed=1;

const saldoEl=document.getElementById("saldo");
const saldo2=document.getElementById("saldo2");
const timerEl=document.getElementById("timer");
const progress=document.getElementById("progress");

const radius=115;
const circumference=2*Math.PI*radius;
progress.style.strokeDasharray=circumference;

setInterval(()=>{
  waktu-=0.1*speed;

  if(waktu<=0){
    saldo+=0.00001;
    waktu=10;
  }

  let percent=waktu/10;
  progress.style.strokeDashoffset=circumference*percent;

  saldoEl.innerText=saldo.toFixed(5);
  saldo2.innerText=saldo.toFixed(5);
  timerEl.innerText=Math.ceil(waktu)+"s";

},100);

function tapCoin(){
  saldo+=0.00005;

  const el=document.createElement("div");
  el.className="floating";
  el.innerText="+0.00005";

  el.style.left="50%";
  el.style.top="50%";

  document.querySelector(".coin-container").appendChild(el);
  setTimeout(()=>el.remove(),1000);
}

function boost(){
  speed=3;
  document.querySelector(".coin").style.boxShadow="0 0 100px #00ffff";

  setTimeout(()=>{
    speed=1;
  },8000);
}

function nav(el){
  document.querySelectorAll(".menuItem").forEach(m=>m.classList.remove("active"));
  el.classList.add("active");

  let name=el.innerText;

  document.getElementById("homePage").style.display="none";
  document.getElementById("taskPage").style.display="none";
  document.getElementById("walletPage").style.display="none";

  if(name.includes("Home")) document.getElementById("homePage").style.display="block";
  if(name.includes("Task")) document.getElementById("taskPage").style.display="block";
  if(name.includes("Wallet")) document.getElementById("walletPage").style.display="block";
}
</script>

</body>
</html>
