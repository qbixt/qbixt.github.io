<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body {
  font-family: sans-serif;
  background: #02070f;
  background-image: 
    /* Stars */
    url("data:image/svg+xml,%3Csvg width='80' height='80' xmlns='http://www.w3.org/2000/svg'%3E%3Ctext x='50%25' y='50%25' font-size='24' text-anchor='middle' dominant-baseline='middle' fill='%23ffd700' opacity='0.25'%3E★%3C/text%3E%3C/svg%3E"),
    /* Gift */
    url("data:image/svg+xml,%3Csvg width='110' height='110' xmlns='http://www.w3.org/2000/svg'%3E%3Ctext x='50%25' y='50%25' font-size='36' text-anchor='middle' dominant-baseline='middle' fill='%23ffcc00' opacity='0.22'%3E%F0%9F%8E%81%3C/text%3E%3C/svg%3E");
  
  background-size: 85px 85px, 130px 130px;
  background-position: 0 0, 45px 35px;
}

/* Optional: tambah noise/tekstur halus biar makin mirip Telegram */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(circle, transparent 40%, rgba(255,255,255,0.03) 41%, transparent 70%);
  background-size: 80px 80px;
  pointer-events: none;
  z-index: -1;
  opacity: 0.6;
}

/* HEADER */
.header{
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(12px);
}

.profile{display:flex;gap:10px;align-items:center;}
.profile img{
  width:45px;height:45px;
  border-radius:50%;
  border:2px solid #00d4ff;
}

.balance{color:#ffd700;font-size:18px;}

/* COIN AREA */
.wrap{display:flex;justify-content:center;margin-top:40px;}
.coin-container{position:relative;width:260px;height:260px;}

.coin{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:160px;height:160px;
  background:radial-gradient(circle,#fff,#ffd700);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:70px;
  box-shadow:0 0 40px gold,0 0 80px rgba(255,215,0,0.5);
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{transform:translate(-50%,-50%) scale(1);}
  100%{transform:translate(-50%,-50%) scale(1.05);}
}

.centerText{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

#timer{font-size:40px;color:#00ffcc;}

/* FLOAT TEXT */
.floating{
  position:absolute;
  color:#00ffcc;
  font-weight:bold;
  animation:floatUp 1s forwards;
}

@keyframes floatUp{
  0%{opacity:1;transform:translate(-50%,-50%);}
  100%{opacity:0;transform:translate(-50%,-120px);}
}

/* BUTTON */
button{
  margin:30px auto;
  display:block;
  padding:12px 40px;
  border:none;
  border-radius:30px;
  background:linear-gradient(90deg,#00d4ff,#0077ff);
  color:white;
}

/* CARD */
.card{
  background:#0f2a44;
  padding:15px;
  border-radius:12px;
  margin-bottom:10px;
}

/* WALLET */
.walletCard{
  background:linear-gradient(135deg,#00d4ff,#0077ff);
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 40px rgba(0,0,0,0.5);
}

/* HISTORY */
.historyItem{
  background:#0f2a44;
  padding:10px;
  border-radius:10px;
  margin-bottom:8px;
}

/* MENU FLOAT */
.menu{
  position:fixed;
  bottom:15px;
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-around;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(12px);
  border-radius:20px;
  padding:10px 0;
}

.menuItem{
  text-align:center;
  flex:1;
  color:#7f8fa6;
}

.menuItem.active{
  color:#00ffcc;
  transform:scale(1.1);
}
</style>
</head>

<body>

<div class="header">
  <div class="profile">
    <img id="avatar">
    <div>
      <h3 id="username">User</h3>
      <p id="userid">ID: 0000</p>
    </div>
  </div>
  <div class="balance">⭐ <span id="saldo">0.00000</span></div>
</div>

<!-- HOME -->
<div id="homePage">
  <div class="wrap">
    <div class="coin-container" onclick="tapCoin()">

      <svg width="260" height="260">
        <circle cx="130" cy="130" r="115"
          fill="none" stroke="#1e3a6b" stroke-width="18"/>
        <circle cx="130" cy="130" r="115"
          fill="none" stroke="#00ffcc" stroke-width="18"
          stroke-linecap="round"
          transform="rotate(-90 130 130)"
          id="progress"/>
      </svg>

      <div class="coin">🔥</div>

      <div class="centerText">
        <div>+0.00005</div>
        <div id="timer">10s</div>
      </div>

    </div>
  </div>

  <button onclick="boost()">BOOST 🚀</button>
</div>

<!-- TASK -->
<div id="taskPage" style="display:none;padding:20px;">
  <div class="card" onclick="claimTask('Join',0.001)">🚀 Join Channel +0.001</div>
  <div class="card" onclick="claimTask('Invite',0.005)">👥 Invite Friend +0.005</div>
</div>

<!-- WALLET -->
<div id="walletPage" style="display:none;padding:20px;">
  <div class="walletCard">
    ⭐ <span id="saldo2">0.00000</span>
  </div>

  <h3 style="margin-top:15px;">History</h3>
  <div id="history"></div>
</div>

<!-- MENU -->
<div class="menu">
  <div class="menuItem active" onclick="nav(this)">🏠</div>
  <div class="menuItem" onclick="nav(this)">📋</div>
  <div class="menuItem" onclick="nav(this)">💰</div>
</div>

<script>
let tg = window.Telegram.WebApp;
tg.expand();

let user = tg.initDataUnsafe.user || {};
username.innerText=user.first_name||"User";
userid.innerText="ID:"+ (user.id||"0");
if(user.photo_url) avatar.src=user.photo_url;

let saldo=parseFloat(localStorage.getItem("saldo"))||0;
let history=JSON.parse(localStorage.getItem("history"))||[];
let claimed=JSON.parse(localStorage.getItem("claimed"))||{};

function save(){
  localStorage.setItem("saldo",saldo);
  localStorage.setItem("history",JSON.stringify(history));
  localStorage.setItem("claimed",JSON.stringify(claimed));
}

function update(){
  document.getElementById("saldo").innerText=saldo.toFixed(5);
  document.getElementById("saldo2").innerText=saldo.toFixed(5);

  let h="";
  history.slice().reverse().forEach(i=>h+=`<div class="historyItem">${i}</div>`);
  document.getElementById("history").innerHTML=h;
}
update();

function tapCoin(){
  saldo+=0.00005;
  history.push("Tap +0.00005");
  save();update();
}

function claimTask(n,a){
  if(claimed[n]) return alert("Sudah claim");
  saldo+=a;
  claimed[n]=true;
  history.push(n+" +"+a);
  save();update();
}

function boost(){
  saldo+=0.001;
  history.push("Boost +0.001");
  save();update();
}

function nav(el){
  document.querySelectorAll(".menuItem").forEach(m=>m.classList.remove("active"));
  el.classList.add("active");

  homePage.style.display="none";
  taskPage.style.display="none";
  walletPage.style.display="none";

  let i=[...el.parentNode.children].indexOf(el);
  if(i==0) homePage.style.display="block";
  if(i==1) taskPage.style.display="block";
  if(i==2) walletPage.style.display="block";
}

/* PROGRESS MUTER */
const progress=document.getElementById("progress");
const r=115;
const c=2*Math.PI*r;
progress.style.strokeDasharray=c;

let t=10;
setInterval(()=>{
  t-=0.1;
  if(t<=0) t=10;
  progress.style.strokeDashoffset=c*(t/10);
  document.getElementById("timer").innerText=Math.ceil(t)+"s";
},100);
</script>

</body>
</html>
