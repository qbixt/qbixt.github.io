<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin:0; padding:0; }
    
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(to bottom, #0a1f38, #000814);
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .header {
      padding: 15px 20px;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e3a6b;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 3px solid #00d4ff;
    }

    .balance {
      text-align: right;
      font-size: 20px;
      color: #ffd700;
    }

    /* Coin Area */
    .wrap {
      display: flex;
      justify-content: center;
      margin: 40px 0 30px;
    }

    .coin-container {
      position: relative;
      width: 260px;
      height: 260px;
    }

    .coin {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 170px;
      height: 170px;
      background: radial-gradient(circle at 40% 40%, #fff, #ffd700);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 85px;
      box-shadow: 0 0 50px #ffd700;
      transition: transform 0.2s;
    }

    .coin:active { transform: translate(-50%, -50%) scale(0.95); }

    .centerText { 
      position: absolute; 
      top: 50%; left: 50%; 
      transform: translate(-50%, -50%); 
      text-align: center; 
      z-index: 2; 
    }

    #timer { font-size: 48px; font-weight: bold; color: #00ffcc; }
    #earn { color: #88eeff; font-size: 15px; }

    button {
      display: block;
      margin: 20px auto;
      padding: 14px 40px;
      background: linear-gradient(90deg, #00d4ff, #0077ff);
      border: none;
      border-radius: 50px;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }

    /* Bottom Menu Premium */
    .menu {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0a1f38;
      display: flex;
      justify-content: space-around;
      padding: 8px 0 12px;
      border-top: 1px solid #1e3a6b;
    }

    .menuItem {
      text-align: center;
      color: #8a9eb8;
      font-size: 12px;
      flex: 1;
    }

    .menuItem.active {
      color: #00ffcc;
    }

    .menuItem svg {
      width: 26px;
      height: 26px;
      margin-bottom: 3px;
      fill: currentColor;
    }

    /* Language Bar */
    .lang-bar {
      position: fixed;
      top: 70px;
      left: 0;
      right: 0;
      background: rgba(255,255,255,0.08);
      padding: 8px 0;
      text-align: center;
      font-size: 13px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .lang-bar span {
      margin: 0 12px;
      padding: 4px 12px;
      border-radius: 20px;
      display: inline-block;
    }

    .lang-bar .active-lang {
      background: #00d4ff;
      color: black;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="profile">
      <img id="avatar" src="https://i.pravatar.cc/150" alt="">
      <div>
        <h3 id="username" style="font-size:16px;">User</h3>
        <p id="userid" style="color:#aaa; font-size:12px;">ID: 000000</p>
      </div>
    </div>
    <div class="balance">⭐ <span id="saldo">0.00000</span></div>
  </div>


  <div id="homePage">
  <div class="wrap">
    start
  </div>
  <div id="taskPage" style="display:none; text-align:center; margin-top:100px;">
  <h2>🚀 Task</h2>
  <p>Coming Soon...</p>
</div>

<div id="walletPage" style="display:none; text-align:center; margin-top:100px;">
  <h2>💰 Wallet</h2>
  <p>Coming Soon...</p>
</div>
  <button onclick="boost()"> BOOST 🚀 </button>
  </div>
    <div class="coin-container" onclick="tapCoin()">
      <svg width="260" height="260" style="filter: drop-shadow(0 0 20px gold);">
        <circle cx="130" cy="130" r="115" fill="none" stroke="#1e3a6b" stroke-width="18"
          <circle cx="130" cy="130" r="115"
  fill="none"
  stroke="#ffd700"
  stroke-width="18"
  stroke-linecap="round"
  transform="rotate(-90 130 130)"
  id="progress"/>
      </svg>
      <div class="coin" id="coin">🔥</div>
      <div class="centerText">
        <div id="earn">+0.00005 / tap</div>
        <div id="timer">10s</div>
      </div>
    </div>
  </div>

  <button onclick="boost()"> BOOST 🚀 </button>

  <!-- Bottom Menu -->

<div class="menuItem" onclick="nav(this)">
  <svg viewBox="0 0 24 24">
    <path d="M9 11l3 3L22 4"/>
    <path d="M21 12v7H3V3h11"/>
  </svg>
  <div>Task</div>
</div>

<div class="menuItem" onclick="nav(this)">
  <svg viewBox="0 0 24 24">
    <path d="M3 7h18v10H3z"/>
    <path d="M17 11a2 2 0 100 4 2 2 0 000-4z"/>
  </svg>
  <div>Wallet</div>
</div>
  <script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    let user = tg.initDataUnsafe.user || {};
    document.getElementById("username").innerText = user.first_name || "User";
    document.getElementById("userid").innerText = "ID: " + (user.id || "000000");
    if (user.photo_url) document.getElementById("avatar").src = user.photo_url;

    let saldo = 0;
    let maxTime = 10;
    let waktu = maxTime;
    let speed = 1;

    const saldoEl = document.getElementById("saldo");
    const timerEl = document.getElementById("timer");
    const progress = document.getElementById("progress");

    const radius = 115;
    const circumference = 2 * Math.PI * radius;
    progress.style.strokeDasharray = circumference;
    progress.style.strokeDashoffset = circumference;

    setInterval(() => {
      waktu -= speed;
      if (waktu <= 0) {
        saldo += 0.00001;
        waktu = maxTime;
      }
      let percent = waktu / maxTime;
      progress.style.strokeDashoffset = circumference * percent;

      saldoEl.innerText = saldo.toFixed(5);
      timerEl.innerText = Math.ceil(waktu) + "s";
    }, 1000);

    function tapCoin() {
      saldo += 0.00005;
      saldoEl.innerText = saldo.toFixed(5);
    }

    function boost() {
      speed = 2.5;
      setTimeout(() => speed = 1, 8000);
    }
    function nav(el) {
  document.querySelectorAll(".menuItem").forEach(m => m.classList.remove("active"));
  el.classList.add("active");

  let name = el.innerText;

  document.getElementById("homePage").style.display = "none";
  document.getElementById("taskPage").style.display = "none";
  document.getElementById("walletPage").style.display = "none";

  if (name === "Home") document.getElementById("homePage").style.display = "block";
  if (name === "Task") document.getElementById("taskPage").style.display = "block";
  if (name === "Wallet") document.getElementById("walletPage").style.display = "block";
    }
    }
  </script>
</body>
</html>
