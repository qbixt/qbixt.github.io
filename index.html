<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin:0; padding:0; }
    
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at 50% 25%, #0f2b4f, #000814);
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.4);
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile img {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 3px solid #ffd700;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
    }

    .nameBox {
      line-height: 1.3;
    }

    .nameBox h3 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
    }

    .nameBox p {
      margin: 0;
      color: #aaa;
      font-size: 13px;
    }

    .balance {
      font-size: 22px;
      font-weight: bold;
      color: #ffd700;
    }

    /* COIN AREA */
    .wrap {
      display: flex;
      justify-content: center;
      margin: 45px 0 30px;
    }

    .coin-container {
      position: relative;
      width: 270px;
      height: 270px;
    }

    svg { transform: rotate(-90deg); }

    .bg { fill: none; stroke: #162d4a; stroke-width: 18; }
    .progress {
      fill: none;
      stroke: #ffd700;
      stroke-width: 18;
      stroke-linecap: round;
      filter: drop-shadow(0 0 20px gold);
    }

    .coin {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 170px;
      height: 170px;
      background: radial-gradient(circle at 38% 38%, #fff, #ffeb3b, #ffb300);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 88px;
      box-shadow: 0 0 45px #ffd700,
                  inset 0 20px 30px rgba(255,255,255,0.8),
                  inset 0 -15px 25px rgba(0,0,0,0.4);
      transition: transform 0.15s;
    }

    .coin:active { 
      transform: translate(-50%, -50%) scale(0.96); 
    }

    .centerText {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 2;
    }

    #timer { font-size: 52px; font-weight: 700; color: #ffd700; }
    #earn { font-size: 15px; color: #a0d8ff; }

    button {
      display: block;
      margin: 15px auto 25px;
      padding: 15px 50px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(90deg, #00d4ff, #0066ff);
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    button:active { transform: scale(0.95); }

    /* MENU - Diperbaiki spacing */
    .menu {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(8, 20, 45, 0.98);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 0 16px;
      border-top: 1px solid #1e3a6b;
      box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
    }

    .menuItem {
      text-align: center;
      color: #8a9eb8;
      font-size: 11.5px;
      flex: 1;
      padding: 5px 0;
    }

    .menuItem.active {
      color: #ffd700;
    }

    .menuItem svg {
      width: 27px;
      height: 27px;
      margin-bottom: 4px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="profile">
      <img id="avatar" src="https://i.pravatar.cc/150" alt="avatar">
      <div class="nameBox">
        <h3 id="username">User</h3>
        <p id="userid">ID: 000000</p>
      </div>
    </div>
    <div class="balance">⭐ <span id="saldo">0.00000</span></div>
  </div>

  <div class="wrap">
    <div class="coin-container" onclick="tapCoin()">
      <svg width="270" height="270">
        <circle cx="135" cy="135" r="118" class="bg"/>
        <circle cx="135" cy="135" r="118" class="progress" id="progress"/>
      </svg>
      <div class="coin" id="coin">⭐</div>
      <div class="centerText">
        <div id="earn">+0.00005 / tap</div>
        <div id="timer">10s</div>
      </div>
    </div>
  </div>

  <button onclick="boost()">⚡ BOOST 8 DETIK</button>

  <!-- MENU LENGKAP -->
  <div class="menu">
    <div class="menuItem active" onclick="nav(this)">
      <svg viewBox="0 0 24 24"><path d="M10 19v-5h4v5h5v-7h3L12 3 2 12h3v7z"/></svg>
      <div>Home</div>
    </div>
    <div class="menuItem" onclick="nav(this)">
      <svg viewBox="0 0 24 24"><path d="M12 1l3 7h7l-5.5 4.5 2 7-6.5-4-6.5 4 2-7-5.5-4.5h7z"/></svg>
      <div>Earn</div>
    </div>
    <div class="menuItem" onclick="nav(this)">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c-2.76 0-5-2.24-5-5"/></svg>
      <div>Exchange</div>
    </div>
    <div class="menuItem" onclick="nav(this)">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <div>Profile</div>
    </div>
  </div>

  <script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    let user = tg.initDataUnsafe.user || {};
    document.getElementById("username").innerText = user.username ? "@" + user.username : user.first_name || "Player";
    document.getElementById("userid").innerText = "ID: " + (user.id || "000000");
    if (user.photo_url) document.getElementById("avatar").src = user.photo_url;

    let saldo = 0;
    let maxTime = 10;
    let waktu = maxTime;
    let speed = 1;

    const saldoEl = document.getElementById("saldo");
    const timerEl = document.getElementById("timer");
    const progress = document.getElementById("progress");

    const radius = 118;
    const circumference = 2 * Math.PI * radius;
    progress.style.strokeDasharray = circumference;
    progress.style.strokeDashoffset = circumference;

    setInterval(() => {
      waktu -= speed;
      if (waktu <= 0) {
        saldo += 0.00001;
        waktu = maxTime;
      }
      let percent = waktu / maxTime;
      progress.style.strokeDashoffset = circumference * percent;

      saldoEl.innerText = saldo.toFixed(5);
      timerEl.innerText = Math.ceil(waktu) + "s";
    }, 1000);

    function tapCoin() {
      saldo += 0.00005;
      saldoEl.innerText = saldo.toFixed(5);
    }

    function boost() {
      speed = 2.5;
      setTimeout(() => speed = 1, 8000);
    }

    function nav(el) {
      document.querySelectorAll(".menuItem").forEach(m => m.classList.remove("active"));
      el.classList.add("active");
    }
  </script>
</body>
</html>
