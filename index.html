<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#0B0F1A;color:#fff}

/* HEADER */
.header{padding:15px}
.user{display:flex;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;overflow:hidden}
.avatar img{width:100%;height:100%}
.username{margin-left:10px}
.balance{text-align:center;font-size:22px}

/* PAGE */
.page{display:none;padding:15px}
.active{display:block}

/* TAP */
.tap{display:flex;justify-content:center;margin-top:20px}
.tap-btn{
  width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,#6D28D9,#3B82F6);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;position:relative;
}

/* EFFECT */
.particle{
  position:absolute;
  animation:up .8s forwards;
}
@keyframes up{
  from{opacity:1;transform:translateY(0)}
  to{opacity:0;transform:translateY(-40px)}
}

/* ENERGY */
.bar{height:6px;background:#222;border-radius:10px;margin-top:10px}
.fill{height:100%;background:#A855F7}

/* MINI */
.mini{display:flex;justify-content:center;gap:10px;margin-top:15px}
.mini button{
  background:#1F2937;border:none;color:#fff;
  padding:10px 15px;border-radius:15px
}

/* CARD */
.card{
  background:#1F2937;
  padding:15px;
  border-radius:15px;
  margin-top:15px;
}

/* CHECKIN */
.checkin{display:flex;gap:6px;overflow:auto}
.checkin div{
  min-width:60px;
  background:#111;
  padding:8px;
  border-radius:10px;
  text-align:center;
}

/* SPIN */
.spin-box{
  text-align:center;
}
#wheel{
  width:160px;height:160px;
  border-radius:50%;
  margin:auto;
  border:5px solid #333;
  transition:transform 2s ease-out;
  background:conic-gradient(
    #3B82F6 0 51deg,
    #A855F7 51 102deg,
    #EC4899 102 153deg,
    #22C55E 153 204deg,
    #F59E0B 204 255deg,
    #EF4444 255 306deg,
    #6366F1 306 360deg
  );
}

/* NAV */
.nav{
  position:fixed;bottom:0;left:0;right:0;
  display:flex;background:#111
}
.nav div{
  flex:1;text-align:center;padding:10px;
  color:#aaa;font-size:12px
}
.nav .active{color:#A855F7}
</style>
</head>

<body>

<div class="header">
  <div class="user">
    <div class="avatar" id="avatar">U</div>
    <div id="username">@Guest</div>
  </div>
  <div class="balance" id="balance">0 BGC</div>
</div>

<!-- HOME -->
<div id="home" class="page active">
  <div class="tap">
    <div class="tap-btn" onclick="tap()" id="tapBtn">BGC</div>
  </div>

  <div id="energyText"></div>
  <div class="bar"><div id="energyFill" class="fill"></div></div>

  <div class="mini">
    <button onclick="openPage('boost')">⚡ Boost</button>
    <button onclick="openPage('game')">🎮 Game</button>
  </div>
</div>

<!-- BOOST -->
<div id="boost" class="page">
  <button onclick="openPage('home')">⬅ Back</button>

  <div class="card">
    <h3>⚡ Energy Boost</h3>
    <button onclick="buy(2500,300)">2500 - 300</button><br><br>
    <button onclick="buy(5000,500)">5000 - 500</button><br><br>
    <button onclick="buy(12000,1000)">12000 - 1000</button>
  </div>
</div>

<!-- GAME -->
<div id="game" class="page">
  <button onclick="openPage('home')">⬅ Back</button>

  <div class="card">
    <h3>Daily Check-in</h3>
    <div id="checkin" class="checkin"></div>
    <button onclick="claim()">Claim</button>
  </div>

  <div class="card spin-box">
    <h3>🎰 Spin</h3>
    <div id="wheel"></div>
    <button onclick="spin()">SPIN</button>
    <p id="spinText"></p>
  </div>
</div>

<!-- TASK -->
<div id="task" class="page"><h3>📋 Task</h3></div>

<!-- TEAM / INVITE -->
<div id="team" class="page">
  <h3>👥 Invite</h3>
  <p>Share your link</p>
</div>

<!-- RANK -->
<div id="rank" class="page"><h3>🏆 Rank</h3></div>

<!-- WALLET -->
<div id="wallet" class="page"><h3>💰 Wallet</h3></div>

<!-- NAV -->
<div class="nav">
  <div class="active" onclick="nav(this,'home')">🏠</div>
  <div onclick="nav(this,'task')">📋</div>
  <div onclick="nav(this,'rank')">🏆</div>
  <div onclick="nav(this,'team')">👥</div>
  <div onclick="nav(this,'wallet')">💰</div>
</div>

<script>
// USER
setTimeout(()=>{
  let u=window.Telegram.WebApp.initDataUnsafe?.user;
  if(u){
    username.innerText="@"+(u.username||u.first_name);
  }
},500);

// DATA
let balance=+localStorage.balance||0;
let energy=+localStorage.energy||1000;
let maxEnergy=+localStorage.maxEnergy||1000;

// UPDATE
function update(){
  balanceEl.innerText=balance+" BGC";
  energyText.innerText=energy+"/"+maxEnergy;
  energyFill.style.width=(energy/maxEnergy*100)+"%";
}
update();

// SAVE
function save(){
  localStorage.balance=balance;
  localStorage.energy=energy;
  localStorage.maxEnergy=maxEnergy;
}

// TAP
function tap(){
  if(energy<=0)return;
  balance++;energy--;
  save();update();

  let p=document.createElement("div");
  p.className="particle";
  p.innerText="+1";
  p.style.left=Math.random()*120+"px";
  p.style.top="80px";
  tapBtn.appendChild(p);
  setTimeout(()=>p.remove(),800);
}

// PAGE
function openPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function nav(el,id){
  document.querySelectorAll(".nav div").forEach(x=>x.classList.remove("active"));
  el.classList.add("active");
  openPage(id);
}

// BOOST
function buy(val,price){
  if(balance<price)return alert("Not enough");
  balance-=price;
  maxEnergy=val;
  energy=val;
  save();update();
}

// DAILY
let rewards=[50,150,200,300,400,450,700];
let day=+localStorage.day||0;

function renderCheck(){
  checkin.innerHTML="";
  rewards.forEach((r,i)=>{
    let d=document.createElement("div");
    d.innerText=i<day?"✓":"D"+(i+1);
    checkin.appendChild(d);
  });
}
renderCheck();

function claim(){
  balance+=rewards[day];
  day=(day+1)%7;
  localStorage.day=day;
  save();update();renderCheck();
}

// SPIN
function spin(){
  let i=Math.floor(Math.random()*7);
  let r=[50,10,1000,5,20,100,15][i];
  balance+=r;
  spinText.innerText="You got "+r;
  save();update();
}
</script>

</body>
</html>
