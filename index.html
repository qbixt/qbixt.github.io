<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#0B0F1A;color:#fff}

/* HEADER */
.header{padding:15px}
.user{display:flex;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#3B82F6,#A855F7);display:flex;align-items:center;justify-content:center}
.avatar img{width:100%;height:100%;border-radius:50%}
.username{margin-left:10px}

.balance{text-align:center}
.balance h1{margin:5px 0}

/* TAP */
.tap-area{display:flex;justify-content:center;margin-top:20px}
.tap-btn{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,#A855F7,#3B82F6);display:flex;align-items:center;justify-content:center;font-size:22px}

/* ENERGY */
.energy-box{margin:20px}
.energy-bar{height:8px;background:#1F2937;border-radius:10px;overflow:hidden}
.energy-fill{height:100%;background:linear-gradient(90deg,#3B82F6,#A855F7)}

/* MINI MENU */
.mini-menu{display:flex;justify-content:center;gap:10px}
.mini-btn{padding:10px 15px;background:#1F2937;border-radius:15px}

/* PAGE */
.page{display:none;padding:15px}
.active{display:block}

/* NAV */
.bottom-nav{position:fixed;bottom:10px;left:10px;right:10px;display:flex;background:#111;border-radius:20px}
.bottom-nav div{flex:1;text-align:center;padding:10px;color:#aaa}
.bottom-nav .active{color:#A855F7}
</style>
</head>

<body>

<div class="header">
  <div class="user">
    <div class="avatar" id="avatar">U</div>
    <div class="username" id="username">@Guest</div>
  </div>

  <div class="balance">
    <div>Balance</div>
    <h1 id="balance">0 BGC</h1>
  </div>
</div>

<!-- HOME -->
<div id="homePage" class="page active">
  <div class="tap-area">
    <div class="tap-btn" onclick="tap()">BGC</div>
  </div>

  <div class="energy-box">
    <div id="energyText"></div>
    <div class="energy-bar"><div id="energyFill" class="energy-fill"></div></div>
  </div>

  <div class="mini-menu">
    <div class="mini-btn" onclick="openPage('boostPage')">⚡ Boost</div>
    <div class="mini-btn" onclick="openPage('gamePage')">🎮 Game</div>
  </div>
</div>

<!-- GAME -->
<div id="gamePage" class="page">
  <h2>Game</h2>
  <div id="checkinBox"></div>
  <button onclick="claimCheckin()">Claim Daily</button>

  <br><br>
  <button onclick="spin()">SPIN</button>
  <p id="spinResult"></p>
</div>

<!-- BOOST -->
<div id="boostPage" class="page">
  <h2>Boost</h2>
  <button onclick="buyBoost(2500,300)">2500 - 300 BGC</button><br>
  <button onclick="buyBoost(5000,500)">5000 - 500 BGC</button><br>
  <button onclick="buyBoost(12000,1000)">12000 - 1000 BGC</button>
</div>

<!-- NAV -->
<div class="bottom-nav">
  <div onclick="nav(this,'homePage')" class="active">🏠</div>
  <div onclick="nav(this,'gamePage')">🎮</div>
  <div onclick="nav(this,'boostPage')">⚡</div>
</div>

<script>
// TELEGRAM
let tg=window.Telegram.WebApp;
tg.expand();

let user=tg.initDataUnsafe.user;
if(user){
  document.getElementById("username").innerText="@"+(user.username||user.first_name);
  if(user.photo_url){
    document.getElementById("avatar").innerHTML="<img src='"+user.photo_url+"'>";
  }
}

// DATA
let balance=parseInt(localStorage.getItem("balance"))||0;
let maxEnergy=parseInt(localStorage.getItem("maxEnergy"))||1000;
let energy=parseInt(localStorage.getItem("energy"))||maxEnergy;

// UPDATE
function updateUI(){
  document.getElementById("balance").innerText=balance+" BGC";
  document.getElementById("energyText").innerText=energy+" / "+maxEnergy;
  document.getElementById("energyFill").style.width=(energy/maxEnergy*100)+"%";
}

// SAVE
function save(){
  localStorage.setItem("balance",balance);
  localStorage.setItem("energy",energy);
  localStorage.setItem("maxEnergy",maxEnergy);
}

// TAP
function tap(){
  if(energy<=0)return;
  balance++;
  energy--;
  save();
  updateUI();
}

// REGEN
setInterval(()=>{
  if(energy<maxEnergy){
    energy++;
    save();
    updateUI();
  }
},5000);

// NAV
function nav(el,page){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll(".bottom-nav div").forEach(p=>p.classList.remove("active"));
  document.getElementById(page).classList.add("active");
  el.classList.add("active");
}

// OPEN PAGE
function openPage(p){
  document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
  document.getElementById(p).classList.add("active");
}

// BOOST
function buyBoost(val,price){
  if(balance<price)return alert("Not enough BGC");
  balance-=price;
  maxEnergy=val;
  energy=val;
  save();
  updateUI();
}

// CHECKIN
let rewards=[50,150,200,300,400,450,700];
let day=parseInt(localStorage.getItem("day"))||0;
let last=localStorage.getItem("lastCheck")||0;

function claimCheckin(){
  let now=Date.now();
  if(now-last<86400000)return alert("Already claimed");
  balance+=rewards[day];
  day=(day+1)%7;
  localStorage.setItem("day",day);
  localStorage.setItem("lastCheck",now);
  save();
  updateUI();
}

// SPIN
let spinList=["50 BGC","1000 BGC","10 BGC","5 Star","50 Star","0.1 TON","5 TON"];
let lastSpin=localStorage.getItem("spin")||0;

function spin(){
  let now=Date.now();
  if(now-lastSpin<86400000)return alert("Already spin");

  let r=spinList[Math.floor(Math.random()*spinList.length)];
  document.getElementById("spinResult").innerText="You got "+r;

  if(r.includes("BGC")){
    balance+=parseInt(r);
  }

  localStorage.setItem("spin",now);
  save();
  updateUI();
}

// INIT
updateUI();
</script>

</body>
</html>
