<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:linear-gradient(180deg,#0B0F1A,#111827);
  color:#fff;
}

/* HEADER */
.header{padding:15px}
.user{display:flex;align-items:center}
.avatar{
  width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,#3B82F6,#A855F7);
}
.username{margin-left:10px;font-size:14px}

.balance{text-align:center}
.balance h1{
  margin:5px 0;
  font-size:28px;
  background:linear-gradient(90deg,#3B82F6,#A855F7);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* TAP */
.tap{
  display:flex;
  justify-content:center;
  margin-top:30px;
}
.tap-btn{
  width:200px;height:200px;
  border-radius:50%;
  background:radial-gradient(circle,#A855F7,#3B82F6);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;
  position:relative;

  box-shadow:
    0 0 40px rgba(168,85,247,0.5),
    inset 0 0 20px rgba(255,255,255,0.2);

  transition:transform .1s;
}
.tap-btn:active{transform:scale(.9)}

/* TAP EFFECT */
.particle{
  position:absolute;
  font-weight:bold;
  animation:up .8s forwards;
}
@keyframes up{
  from{opacity:1;transform:translateY(0)}
  to{opacity:0;transform:translateY(-60px)}
}

/* ENERGY */
.energy{margin:20px}
.bar{
  height:8px;
  background:#1F2937;
  border-radius:10px;
}
.fill{
  height:100%;
  background:linear-gradient(90deg,#3B82F6,#A855F7);
}

/* MINI */
.mini{
  display:flex;
  justify-content:center;
  gap:15px;
}
.mini button{
  padding:10px 18px;
  border:none;
  border-radius:20px;
  background:rgba(255,255,255,0.05);
  color:white;
  backdrop-filter:blur(10px);
}

/* CARD */
.card{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
  padding:15px;
  border-radius:15px;
  margin-top:15px;
}

/* CHECKIN */
.checkin{display:flex;gap:8px;overflow:auto}
.checkin div{
  min-width:60px;
  padding:10px;
  border-radius:10px;
  text-align:center;
  background:#111;
}

/* SPIN */
#wheel{
  width:160px;height:160px;
  border-radius:50%;
  margin:auto;
  border:5px solid rgba(255,255,255,0.1);
  transition:transform 2s ease-out;
  background:conic-gradient(
    #3B82F6 0 51deg,
    #A855F7 51 102deg,
    #EC4899 102 153deg,
    #22C55E 153 204deg,
    #F59E0B 204 255deg,
    #EF4444 255 306deg,
    #6366F1 306 360deg
  );
}

/* NAV */
.nav{
  position:fixed;bottom:0;left:0;right:0;
  display:flex;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
}
.nav div{
  flex:1;
  text-align:center;
  padding:10px;
  color:#aaa;
}
.nav .active{color:#A855F7}
</style>
</head>

<body>

<div class="header">
  <div class="user">
    <div class="avatar"></div>
    <div class="username">@Player</div>
  </div>

  <div class="balance">
    <div>Balance</div>
    <h1 id="balance">0 BGC</h1>
  </div>
</div>

<div class="tap">
  <div class="tap-btn" id="tapBtn" onclick="tap()">BGC</div>
</div>

<div class="energy">
  <div id="energyText"></div>
  <div class="bar"><div id="energyFill" class="fill"></div></div>
</div>

<div class="mini">
  <button onclick="alert('Boost page')">⚡ Boost</button>
  <button onclick="alert('Game page')">🎮 Game</button>
</div>

<script>
let balance=0;
let energy=1000;
let maxEnergy=1000;

function update(){
  balanceEl.innerText=balance+" BGC";
  energyText.innerText=energy+" / "+maxEnergy;
  energyFill.style.width=(energy/maxEnergy*100)+"%";
}
update();

function tap(){
  if(energy<=0)return;

  balance++;
  energy--;
  update();

  let btn=document.getElementById("tapBtn");

  btn.style.transform="scale(0.9)";
  setTimeout(()=>btn.style.transform="scale(1)",100);

  let p=document.createElement("div");
  p.className="particle";
  p.innerText="+1";
  p.style.left=Math.random()*120+"px";
  p.style.top="80px";

  btn.appendChild(p);
  setTimeout(()=>p.remove(),800);
}
</script>

</body>
</html>
