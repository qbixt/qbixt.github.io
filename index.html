<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#0B0F1A;
  color:#fff;
}

/* HEADER */
.header{padding:15px}
.user{display:flex;align-items:center}
.avatar{
  width:42px;height:42px;border-radius:50%;
  background:#333;display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.avatar img{width:100%;height:100%}
.username{margin-left:10px}

.balance{text-align:center}

/* PAGE */
.page{display:none;padding:15px}
.page.active{display:block}

/* TAP */
.tap{display:flex;justify-content:center;margin-top:20px}
.tap-btn{
  width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,#A855F7,#3B82F6);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;
  position:relative;
  box-shadow:0 0 40px rgba(168,85,247,0.6);
}
.tap-btn:active{transform:scale(.9)}

/* TAP EFFECT */
.particle{
  position:absolute;
  font-size:14px;
  font-weight:bold;
  pointer-events:none;
  animation:floatUp 0.8s ease-out forwards;
}
@keyframes floatUp{
  0%{opacity:1;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(-50px) scale(1.3)}
}

/* ENERGY */
.energy{margin:20px}
.bar{height:8px;background:#1F2937;border-radius:10px}
.fill{height:100%;background:linear-gradient(90deg,#3B82F6,#A855F7)}

/* MINI */
.mini{display:flex;justify-content:center;gap:15px}
.mini button{
  padding:10px 20px;border:none;border-radius:20px;
  background:#1F2937;color:#fff;cursor:pointer
}

/* NAV */
.nav{
  position:fixed;bottom:0;left:0;right:0;
  display:flex;background:#111
}
.nav div{
  flex:1;text-align:center;padding:10px;
  color:#aaa;cursor:pointer
}
.nav .active{color:#A855F7}

/* CHECKIN */
.checkin{display:flex;gap:8px;overflow-x:auto}
.checkin div{
  min-width:70px;padding:10px;border-radius:10px;text-align:center;background:#111;
}

/* WHEEL */
#wheel{
  width:180px;height:180px;border-radius:50%;
  margin:auto;border:6px solid #1F2937;
  transition:transform 2s ease-out;
  background:conic-gradient(
    #3B82F6 0deg 51deg,
    #A855F7 51deg 102deg,
    #EC4899 102deg 153deg,
    #22C55E 153deg 204deg,
    #F59E0B 204deg 255deg,
    #EF4444 255deg 306deg,
    #6366F1 306deg 360deg
  );
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="user">
    <div class="avatar" id="avatar">U</div>
    <div class="username" id="username">@Guest</div>
  </div>

  <div class="balance">
    <div>Balance</div>
    <h2 id="balance">0 BGC</h2>
  </div>
</div>

<!-- HOME -->
<div id="home" class="page active">

  <div class="tap">
    <div class="tap-btn" id="tapBtn" onclick="tap()">BGC</div>
  </div>

  <div class="energy">
    <div id="energyText"></div>
    <div class="bar"><div id="energyFill" class="fill"></div></div>
  </div>

  <div class="mini">
    <button onclick="goPage('boost')">⚡ Boost</button>
    <button onclick="goPage('game')">🎮 Game</button>
  </div>

</div>

<!-- BOOST -->
<div id="boost" class="page">
  <button onclick="goPage('home')">⬅ Back</button>
  <h3>⚡ Energy Boost</h3>

  <button onclick="buyBoost(2500,300)">2500 Energy - 300 BGC</button><br><br>
  <button onclick="buyBoost(5000,500)">5000 Energy - 500 BGC</button><br><br>
  <button onclick="buyBoost(12000,1000)">12000 Energy - 1000 BGC</button>
</div>

<!-- GAME -->
<div id="game" class="page">
  <button onclick="goPage('home')">⬅ Back</button>

  <h3>Daily Check-in</h3>
  <div id="checkinBox" class="checkin"></div>
  <button onclick="claimCheckin()">Claim</button>

  <h3 style="margin-top:20px;">🎰 Spin</h3>

  <div id="wheel"></div>

  <div style="text-align:center;margin-top:10px">
    <button onclick="spinWheel()">SPIN</button>
    <p id="spinText"></p>
  </div>
</div>

<!-- NAV -->
<div class="nav">
  <div class="active" onclick="nav(this,'home')">🏠</div>
  <div onclick="nav(this,'boost')">⚡</div>
  <div onclick="nav(this,'game')">🎮</div>
</div>

<script>
// TELEGRAM
setTimeout(()=>{
  let u=window.Telegram.WebApp.initDataUnsafe?.user;
  if(u){
    username.innerText="@"+(u.username||u.first_name);
    if(u.photo_url){
      avatar.innerHTML="<img src='"+u.photo_url+"'>";
    }
  }
},500);

// DATA
let balance=+localStorage.balance||0;
let energy=+localStorage.energy||1000;
let maxEnergy=+localStorage.maxEnergy||1000;

// UPDATE
function update(){
  document.getElementById("balance").innerText=balance+" BGC";
  document.getElementById("energyText").innerText=energy+" / "+maxEnergy;
  document.getElementById("energyFill").style.width=(energy/maxEnergy*100)+"%";
}
update();

// SAVE
function save(){
  localStorage.balance=balance;
  localStorage.energy=energy;
  localStorage.maxEnergy=maxEnergy;
}

// TAP + EFFECT
function tap(){
  if(energy<=0)return;

  balance++;
  energy--;

  save();
  update();

  let btn=document.getElementById("tapBtn");

  let p=document.createElement("div");
  p.className="particle";

  let effects=["+1","✨","⚡"];
  p.innerText=effects[Math.floor(Math.random()*effects.length)];

  p.style.left=(Math.random()*120+40)+"px";
  p.style.top="80px";

  p.style.color=["#A855F7","#3B82F6","#EC4899"][Math.floor(Math.random()*3)];

  btn.appendChild(p);
  setTimeout(()=>p.remove(),800);
}

// REGEN
setInterval(()=>{
  if(energy<maxEnergy){
    energy++;
    save();
    update();
  }
},5000);

// NAV
function goPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function nav(el,id){
  document.querySelectorAll(".nav div").forEach(x=>x.classList.remove("active"));
  el.classList.add("active");
  goPage(id);
}

// BOOST
function buyBoost(val,price){
  if(balance<price)return alert("Not enough");
  balance-=price;
  maxEnergy=val;
  energy=val;
  save();update();
}

// DAILY
let rewards=[50,150,200,300,400,450,700];
let day=+localStorage.day||0;
let lastCheck=+localStorage.lastCheck||0;

function renderCheckin(){
  checkinBox.innerHTML="";
  rewards.forEach((r,i)=>{
    let d=document.createElement("div");
    d.innerText=i<day?"✓":"D"+(i+1)+"\n"+r;
    if(i<day)d.style.background="#16a34a";
    checkinBox.appendChild(d);
  });
}
renderCheckin();

function claimCheckin(){
  let now=Date.now();
  if(now-lastCheck<86400000)return alert("Already claimed");
  balance+=rewards[day];
  day=(day+1)%7;
  localStorage.day=day;
  localStorage.lastCheck=now;
  save();update();renderCheckin();
}

// SPIN
let spinning=false;
let rewardsWheel=[
  {text:"50 BGC",value:50},
  {text:"5 BGC",value:5},
  {text:"50 BGC",value:50},
  {text:"1000 BGC",value:1000},
  {text:"0.1 TON",value:0},
  {text:"5 TON",value:0},
  {text:"10 BGC",value:10}
];

function spinWheel(){
  let now=Date.now();
  let lastSpin=+localStorage.lastSpin||0;

  if(now-lastSpin<86400000)return alert("1x per day");
  if(spinning)return;

  spinning=true;

  let wheel=document.getElementById("wheel");
  let i=Math.floor(Math.random()*rewardsWheel.length);

  let deg=360*5+(i*(360/rewardsWheel.length));
  wheel.style.transform="rotate(-"+deg+"deg)";

  setTimeout(()=>{
    let r=rewardsWheel[i];
    spinText.innerText="You got "+r.text;
    if(r.value>0)balance+=r.value;

    localStorage.lastSpin=Date.now();
    save();update();

    spinning=false;
  },2000);
}
</script>

</body>
</html>
