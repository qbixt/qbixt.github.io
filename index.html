<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin:0; padding:0; }
    
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(to bottom, #0a1f38, #000814);
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .header {
      padding: 15px 20px;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e3a6b;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 3px solid #00d4ff;
    }

    .balance {
      text-align: right;
      font-size: 20px;
      color: #ffd700;
    }

    /* Coin Area */
    .wrap {
      display: flex;
      justify-content: center;
      margin: 40px 0 30px;
    }

    .coin-container {
      position: relative;
      width: 260px;
      height: 260px;
    }

    .coin {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 170px;
      height: 170px;
      background: radial-gradient(circle at 40% 40%, #fff, #ffd700);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 85px;
      box-shadow: 0 0 50px #ffd700;
      transition: transform 0.2s;
    }

    .coin:active { transform: translate(-50%, -50%) scale(0.95); }

    .centerText { 
      position: absolute; 
      top: 50%; left: 50%; 
      transform: translate(-50%, -50%); 
      text-align: center; 
      z-index: 2; 
    }

    #timer { font-size: 48px; font-weight: bold; color: #00ffcc; }
    #earn { color: #88eeff; font-size: 15px; }

    button {
      display: block;
      margin: 20px auto;
      padding: 14px 40px;
      background: linear-gradient(90deg, #00d4ff, #0077ff);
      border: none;
      border-radius: 50px;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }

    /* Bottom Menu Premium */
    .menu {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0a1f38;
      display: flex;
      justify-content: space-around;
      padding: 8px 0 12px;
      border-top: 1px solid #1e3a6b;
    }

    .menuItem {
      text-align: center;
      color: #8a9eb8;
      font-size: 12px;
      flex: 1;
    }

    .menuItem.active {
      color: #00ffcc;
    }

    .menuItem svg {
      width: 26px;
      height: 26px;
      margin-bottom: 3px;
      fill: currentColor;
    }

    /* Language Bar */
    .lang-bar {
      position: fixed;
      top: 70px;
      left: 0;
      right: 0;
      background: rgba(255,255,255,0.08);
      padding: 8px 0;
      text-align: center;
      font-size: 13px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .lang-bar span {
      margin: 0 12px;
      padding: 4px 12px;
      border-radius: 20px;
      display: inline-block;
    }

    .lang-bar .active-lang {
      background: #00d4ff;
      color: black;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="profile">
      <img id="avatar" src="https://i.pravatar.cc/150" alt="">
      <div>
        <h3 id="username" style="font-size:16px;">User</h3>
        <p id="userid" style="color:#aaa; font-size:12px;">ID: 000000</p>
      </div>
    </div>
    <div class="balance">⭐ <span id="saldo">0.00000</span></div>
  </div>

  <!-- Language Bar -->
  <div class="lang-bar">
    <span class="active-lang">🇬🇧 EN</span>
    <span>🇷🇺 RU</span>
    <span>🇨🇳 ZH</span>
    <span>🇮🇩 ID</span>
  </div>

  <div class="wrap">
    <div class="coin-container" onclick="tapCoin()">
      <svg width="260" height="260" style="filter: drop-shadow(0 0 20px gold);">
        <circle cx="130" cy="130" r="115" fill="none" stroke="#1e3a6b" stroke-width="18"/>
        <circle cx="130" cy="130" r="115" fill="none" stroke="#ffd700" stroke-width="18" stroke-linecap="round" id="progress"/>
      </svg>
      <div class="coin" id="coin">⭐</div>
      <div class="centerText">
        <div id="earn">+0.00005 / tap</div>
        <div id="timer">10s</div>
      </div>
    </div>
  </div>

  <button onclick="boost()">⚡ BOOST 8 DETIK</button>

  <!-- Bottom Menu -->
  <div class="menu">
    <div class="menuItem active" onclick="nav(this)">
      <svg viewBox="0 0 24 24"><path d="M10 19v-5h4v5h5v-7h3L12 3 2 12h3v7z"/></svg>
      <div>Home</div>
    </div>
    <div class="menuItem" onclick="nav(this)">
      <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <div>Friends</div>
    </div>
    <div class="menuItem" onclick="nav(this)">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.59 2 12.5c0 3.55 2.24 6.59 5.36 7.84.4.1.54-.17.54-.38 0-.18-.01-.66-.01-1.3-2.2.48-2.66-1.06-2.66-1.06-.36-.92-.88-1.16-.88-1.16-.72-.5.05-.49.05-.49.8.06 1.22.82 1.22.82.71 1.22 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.65-.89-3.65-3.96 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.22 2.2.82 1.64-.46 3.4-.46 5.04 0 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.08-1.88 3.76-3.67 3.96.29.25.55.73.55 1.48 0 1.07-.01 1.93-.01 2.19 0 .21.14.46.55.38A10.5 10.5 0 0022 12.5C22 6.59 17.52 2 12 2z"/></svg>
      <div>About</div>
    </div>
    <div class="menuItem" onclick="nav(this)">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 16H6v-2h12v2zm0-4H6v-2h12v2zm0-4H6V7h12v2z"/></svg>
      <div>Tasks</div>
    </div>
  </div>

  <script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    let user = tg.initDataUnsafe.user || {};
    document.getElementById("username").innerText = user.first_name || "User";
    document.getElementById("userid").innerText = "ID: " + (user.id || "000000");
    if (user.photo_url) document.getElementById("avatar").src = user.photo_url;

    let saldo = 0;
    let maxTime = 10;
    let waktu = maxTime;
    let speed = 1;

    const saldoEl = document.getElementById("saldo");
    const timerEl = document.getElementById("timer");
    const progress = document.getElementById("progress");

    const radius = 115;
    const circumference = 2 * Math.PI * radius;
    progress.style.strokeDasharray = circumference;
    progress.style.strokeDashoffset = circumference;

    setInterval(() => {
      waktu -= speed;
      if (waktu <= 0) {
        saldo += 0.00001;
        waktu = maxTime;
      }
      let percent = waktu / maxTime;
      progress.style.strokeDashoffset = circumference * percent;

      saldoEl.innerText = saldo.toFixed(5);
      timerEl.innerText = Math.ceil(waktu) + "s";
    }, 1000);

    function tapCoin() {
      saldo += 0.00005;
      saldoEl.innerText = saldo.toFixed(5);
    }

    function boost() {
      speed = 2.5;
      setTimeout(() => speed = 1, 8000);
    }

    function nav(el) {
      document.querySelectorAll(".menuItem").forEach(m => m.classList.remove("active"));
      el.classList.add("active");
    }
  </script>
</body>
</html>
