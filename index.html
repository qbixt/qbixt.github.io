<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#0B0F1A;color:#fff}

/* HEADER */
.header{padding:15px}
.user{display:flex;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;overflow:hidden}
.avatar img{width:100%;height:100%}
.username{margin-left:10px}

.balance{text-align:center}
.balance h1{margin:5px 0}

/* PAGE */
.page{display:none;padding:15px}
.active{display:block}

/* TAP */
.tap{display:flex;justify-content:center;margin:20px}
.btn{width:180px;height:180px;border-radius:50%;background:linear-gradient(#A855F7,#3B82F6);display:flex;align-items:center;justify-content:center;font-size:20px}

/* ENERGY */
.energy{margin:15px}
.bar{height:8px;background:#222;border-radius:10px}
.fill{height:100%;background:#A855F7}

/* MINI */
.mini{display:flex;justify-content:center;gap:10px}
.mini div{padding:10px 15px;background:#222;border-radius:15px}

/* NAV */
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#111}
.nav div{flex:1;text-align:center;padding:10px;color:#aaa;font-size:12px}
.nav .active{color:#A855F7}
</style>
</head>

<body>

<div class="header">
  <div class="user">
    <div class="avatar" id="avatar">U</div>
    <div class="username" id="username">@Guest</div>
  </div>

  <div class="balance">
    <div>Balance</div>
    <h1 id="balance">0 BGC</h1>
  </div>
</div>

<!-- HOME -->
<div id="home" class="page active">
  <div class="tap">
    <div class="btn" onclick="tap()">BGC</div>
  </div>

  <div class="energy">
    <div id="energyText"></div>
    <div class="bar"><div id="energyFill" class="fill"></div></div>
  </div>

  <div class="mini">
    <div onclick="show('boost')">⚡ Boost</div>
    <div onclick="show('game')">🎮 Game</div>
  </div>
</div>

<!-- GAME -->
<div id="game" class="page">
  <h3>Daily Check-in</h3>
  <button onclick="claim()">Claim</button>

  <h3>Spin</h3>
  <button onclick="spin()">Spin</button>
  <p id="spinText"></p>
</div>

<!-- BOOST -->
<div id="boost" class="page">
  <button onclick="boost(2500,300)">2500 - 300</button><br>
  <button onclick="boost(5000,500)">5000 - 500</button><br>
  <button onclick="boost(12000,1000)">12000 - 1000</button>
</div>

<!-- TASK -->
<div id="task" class="page"><h3>Task</h3></div>

<!-- RANK -->
<div id="rank" class="page"><h3>Rank</h3></div>

<!-- TEAM -->
<div id="team" class="page"><h3>Team</h3></div>

<!-- WALLET -->
<div id="wallet" class="page"><h3>Wallet</h3></div>

<!-- NAV -->
<div class="nav">
  <div class="active" onclick="nav(this,'home')">Home</div>
  <div onclick="nav(this,'task')">Task</div>
  <div onclick="nav(this,'rank')">Rank</div>
  <div onclick="nav(this,'team')">Team</div>
  <div onclick="nav(this,'wallet')">Wallet</div>
</div>

<script>
// TELEGRAM FIX
setTimeout(()=>{
  let tg=window.Telegram.WebApp;
  let u=tg.initDataUnsafe?.user;

  if(u){
    username.innerText="@"+(u.username||u.first_name);
    if(u.photo_url){
      avatar.innerHTML="<img src='"+u.photo_url+"'>";
    }else{
      avatar.innerText=u.first_name[0];
    }
  }
},500);

// DATA
let balance=+localStorage.balance||0;
let energy=+localStorage.energy||1000;
let maxEnergy=+localStorage.maxEnergy||1000;

// UI
function update(){
  balanceEl=document.getElementById("balance");
  energyText=document.getElementById("energyText");
  energyFill=document.getElementById("energyFill");

  balanceEl.innerText=balance+" BGC";
  energyText.innerText=energy+" / "+maxEnergy;
  energyFill.style.width=(energy/maxEnergy*100)+"%";
}
update();

// SAVE
function save(){
  localStorage.balance=balance;
  localStorage.energy=energy;
  localStorage.maxEnergy=maxEnergy;
}

// TAP
function tap(){
  if(energy<=0)return;
  balance++;energy--;
  save();update();
}

// REGEN
setInterval(()=>{
  if(energy<maxEnergy){
    energy++;
    save();update();
  }
},5000);

// PAGE
function show(p){
  document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
  document.getElementById(p).classList.add("active");
}

// NAV
function nav(el,p){
  document.querySelectorAll(".nav div").forEach(x=>x.classList.remove("active"));
  el.classList.add("active");
  show(p);
}

// BOOST
function boost(val,price){
  if(balance<price)return alert("Not enough");
  balance-=price;
  maxEnergy=val;
  energy=val;
  save();update();
}

// DAILY
let last=+localStorage.last||0;
function claim(){
  let now=Date.now();
  if(now-last<86400000)return alert("Already claimed");
  balance+=100;
  localStorage.last=now;
  save();update();
}

// SPIN
let lastSpin=+localStorage.spin||0;
function spin(){
  let now=Date.now();
  if(now-lastSpin<86400000)return alert("Used");

  let list=[50,10,1000,5];
  let r=list[Math.floor(Math.random()*list.length)];

  balance+=r;
  spinText.innerText="You got "+r;

  localStorage.spin=now;
  save();update();
}
</script>

</body>
</html>
